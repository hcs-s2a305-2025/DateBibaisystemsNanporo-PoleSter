<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
    <link href="../../static/css/add.css" th:href="@{/css/add.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn"></div>
        <div class="system-title">
            <a href="/" th:href="@{/}"><h2>ORDER ZANGI</h2></a>
        </div>
        <div class="header-stampcard header-btn">
            <a href="/stampcard" th:href="@{/stampcard}">
                <img style="width: 65px; height: auto;" src="../../static/img/スタンプカード.png" th:src="@{/img/スタンプカード.png}" alt="スタンプカード">
            </a>
        </div>
    </header>

    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC" th:if="${goods != null}">
            <!-- カート追加用フォーム -->
            <form th:action="@{/cart/add}" method="POST" class="additem-block">
                <!-- 商品IDの保持 -->
                <input type="hidden" name="goodsId" th:value="${goods.goodsId}">
                <input type="hidden" id="basePrice" th:value="${goods.price}">
                <input type="hidden" name="editCartItemId" th:value="${editCartItemId}">

                <img class="add-product-img" th:src="@{${goods.photo}}" src="../../static/img/ザンギ弁当.jpg" alt="">
                <div class="add-select">
                    <h1 th:text="${goods.goodsName}">元祖ザンギ弁当（5個）</h1>
                    <h3 th:text="${'￥' + #numbers.formatInteger(goods.price, 1, 'COMMA') + '円'}">￥780円</h3>
                    <br><br>
                    <div class="add-selector d-flex align-items-center mb-3">
                        <h2 class="fs-5 me-3 mb-0 col-auto">ご飯の量：</h2>
                        <select id="riceSelect" class="form-select form-select-sm col" name="riceAmount">
                            <option value="20" data-price="0" th:selected="${selectedRice == '20'}" selected>普通 (250g)</option>
                            <option value="10" data-price="-30" th:selected="${selectedRice == '10'}">小盛り (150g) (-30円)</option>
                            <option value="30" data-price="50" th:selected="${selectedRice == '30'}">大盛り (350g) (+50円)</option>
                            <option value="40" data-price="100" th:selected="${selectedRice == '40'}">特盛 (450g) (+100円)</option>
                        </select>
                    </div>
                    <div class="add-selector d-flex align-items-center mb-3">
                        <h2 class="fs-5 me-3 mb-0 col-auto">　ソース：</h2>
                        <select id="sourceSelect" class="form-select form-select-sm col" name="sourceType">
                            <option value="0" data-price="0" th:selected="${selectedSource == '0'}">なし</option>
                            <option value="50" data-price="80" th:selected="${selectedSource == '50'}">おろしポン酢ソース (+80円)</option>
                            <option value="51" data-price="120" th:selected="${selectedSource == '51'}">おろしポン酢ソースだく (+120円)</option>
                            <option value="52" data-price="150" th:selected="${selectedSource == '52'}">おろしポン酢ソースだくだく (+150円)</option>
                            <option value="60" data-price="80" th:selected="${selectedSource == '60'}">自家製タルタルソース (+80円)</option>
                            <option value="61" data-price="120" th:selected="${selectedSource == '61'}">自家製タルタルソースだく (+120円)</option>
                            <option value="62" data-price="150" th:selected="${selectedSource == '62'}">自家製タルタルソースだくだく (+150円)</option>
                            <option value="70" data-price="80" th:selected="${selectedSource == '70'}">油淋鶏風ネギダレ (+80円)</option>
                            <option value="71" data-price="120" th:selected="${selectedSource == '71'}">油淋鶏風ネギダレだく (+120円)</option>
                            <option value="72" data-price="150" th:selected="${selectedSource == '72'}">油淋鶏風ネギダレだくだく (+150円)</option>
                            <option value="80" data-price="100" th:selected="${selectedSource == '80'}">皆辣麻婆ソース (+100円)</option>
                            <option value="81" data-price="140" th:selected="${selectedSource == '81'}">皆辣麻婆ソースだく (+140円)</option>
                            <option value="82" data-price="180" th:selected="${selectedSource == '82'}">皆辣麻婆ソースだくだく (+180円)</option>
                        </select>
                    </div>

                    <h1 class="mt-5" style="display: flex; justify-content: center;">
                        合計：￥<span id="totalPriceDisplay" th:text="${#numbers.formatInteger(goods.price, 1, 'COMMA')}">960</span>円
                    </h1>
                    <!-- th:text="${'合計：￥' + #numbers.formatInteger(goods.price, 1, 'COMMA') + '円'}">合計：￥960円</h1> -->
                    <div class="gap-2 pt-2" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                        <button id="changesConfirmedBtn" type="submit" class="btn btn-warning mt-4" style="width: 50%;">カートに入れる</button>
                        <a href="/menu" th:href="@{/menu}" id="discardChanges" class="btn btn-outline-secondary mt-3" style="width: 30%;">破棄して戻る</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div class="footer-btn">
            <a href=""><img style="width: 36px; height: 53px;" src="../../static/img/ホームボタン.png" alt="ホーム"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 48px; height: 53px;"  src="../../static/img/メニューボタン.png" alt="メニュー"></a>
        </div>
        <div class="footer-btn" style="position: relative; top: -20px;">
            <a href=""><img style="width: 77px; height: 96px;" src="../../static/img/予約ボタン.png" alt="予約"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 33px; height: 51px;" src="../../static/img/履歴ボタン.png" alt="履歴"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 60px; height: 51px;" src="../../static/img/マイページボタン.png" alt="マイページ"></a>
        </div>
    </footer>

    <!-- リアルタイム計算JavaScript 【修正ポイント4】 -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const basePriceInput = document.getElementById('basePrice');
        const riceSelect = document.getElementById('riceSelect');
        const sourceSelect = document.getElementById('sourceSelect');
        const totalPriceDisplay = document.getElementById('totalPriceDisplay');

        if (!basePriceInput || !totalPriceDisplay) return;

        const basePrice = parseInt(basePriceInput.value) || 0;

        function updatePrice() {
            const ricePrice = parseInt(riceSelect.options[riceSelect.selectedIndex].dataset.price || 0);
            const sourcePrice = parseInt(sourceSelect.options[sourceSelect.selectedIndex].dataset.price || 0);
            
            const total = basePrice + ricePrice + sourcePrice;
            totalPriceDisplay.textContent = total.toLocaleString();
        }

        if (riceSelect) riceSelect.addEventListener('change', updatePrice);
        if (sourceSelect) sourceSelect.addEventListener('change', updatePrice);

        // 初期表示時計算
        updatePrice();
    });
    </script>
    
</body>

</html>
