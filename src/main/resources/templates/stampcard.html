<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

	<div th:replace="~{common/Layout :: common-head}"></div>

<body>
	<!-- ヘッダー部 -->
	<div th:replace="~{common/Layout :: common-header}"></div>


    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <!-- スタンプカード -->
            <div class="flip-card" onclick="this.classList.toggle('flipped')">
                <div class="flip-card-inner">
                    <!-- スタンプカード表 -->
                    <div class="flip-card-front">
                        <div th:switch="${user.point}">
                            <img th:case="0" class="stampcard-img" src="../static/img/スタンプカード0.png" th:src="@{/img/スタンプカード0.png}" alt="スタンプカード"> 
                            <img th:case="1" class="stampcard-img" src="../static/img/スタンプカード1.png" th:src="@{/img/スタンプカード1.png}" alt="スタンプカード">
                            <img th:case="2" class="stampcard-img" src="../static/img/スタンプカード2.png" th:src="@{/img/スタンプカード2.png}" alt="スタンプカード"> 
                            <img th:case="3" class="stampcard-img" src="../static/img/スタンプカード3.png" th:src="@{/img/スタンプカード3.png}" alt="スタンプカード"> 
                            <img th:case="4" class="stampcard-img" src="../static/img/スタンプカード4.png" th:src="@{/img/スタンプカード4.png}" alt="スタンプカード"> 
                            <img th:case="5" class="stampcard-img" src="../static/img/スタンプカード5.png" th:src="@{/img/スタンプカード5.png}" alt="スタンプカード"> 
                            <img th:case="6" class="stampcard-img" src="../static/img/スタンプカード6.png" th:src="@{/img/スタンプカード6.png}" alt="スタンプカード"> 
                            <img th:case="7" class="stampcard-img" src="../static/img/スタンプカード7.png" th:src="@{/img/スタンプカード7.png}" alt="スタンプカード"> 
                            <img th:case="8" class="stampcard-img" src="../static/img/スタンプカード8.png" th:src="@{/img/スタンプカード8.png}" alt="スタンプカード"> 
                            <img th:case="9" class="stampcard-img" src="../static/img/スタンプカード9.png" th:src="@{/img/スタンプカード9.png}" alt="スタンプカード"> 
                            <img th:case="10" class="stampcard-img" src="../static/img/スタンプカード10.png" th:src="@{/img/スタンプカード10.png}" alt="スタンプカード"> 
                            <img th:case="11" class="stampcard-img" src="../static/img/スタンプカード11.png" th:src="@{/img/スタンプカード11.png}" alt="スタンプカード"> 
                            <img th:case="12" class="stampcard-img" src="../static/img/スタンプカード12.png" th:src="@{/img/スタンプカード12.png}" alt="スタンプカード"> 
                            <img th:case="13" class="stampcard-img" src="../static/img/スタンプカード13.png" th:src="@{/img/スタンプカード13.png}" alt="スタンプカード"> 
                            <img th:case="14" class="stampcard-img" src="../static/img/スタンプカード14.png" th:src="@{/img/スタンプカード14.png}" alt="スタンプカード"> 
                            <img th:case="15" class="stampcard-img" src="../static/img/スタンプカード15.png" th:src="@{/img/スタンプカード15.png}" alt="スタンプカード">
                            <img th:case="16" class="stampcard-img" src="../static/img/スタンプカード16.png" th:src="@{/img/スタンプカード16.png}" alt="スタンプカード">
                            <img th:case="17" class="stampcard-img" src="../static/img/スタンプカード17.png" th:src="@{/img/スタンプカード17.png}" alt="スタンプカード">
                            <img th:case="18" class="stampcard-img" src="../static/img/スタンプカード18.png" th:src="@{/img/スタンプカード18.png}" alt="スタンプカード">
                            <img th:case="19" class="stampcard-img" src="../static/img/スタンプカード19.png" th:src="@{/img/スタンプカード19.png}" alt="スタンプカード">
                            <img th:case="20" class="stampcard-img" src="../static/img/スタンプカード20.png" th:src="@{/img/スタンプカード20.png}" alt="スタンプカード">
                        </div>
                    </div>
                    <!-- スタンプカード裏 -->
                    <div class="flip-card-back">
                        <img class="stampcard-img" src="../static/img/スタンプカード裏.png" th:src="@{/img/スタンプカード裏.png}" alt="スタンプカード">
                        <canvas id="qrcode"
                            th:data-mail="${user.mail}"></canvas>
                    </div>
                </div>
            </div>
            <!-- 割引カード -->
            <div class="coupon-ticket zenmarugothic"
                 th:classappend="${user.stampCouponActive} ? 'coupon-active' : (${user.stampCoupon == 0} ? 'coupon-empty')">
                <div class="coupon-main">
                    <span class="coupon-label">STAMP CARD COUPON</span>
                    <div class="coupon-amount"><span class="coupon-minus">-</span>100<span class="coupon-yen">円</span></div>
                    <span class="coupon-title">スタンプカード割引券</span>
                </div>
                <div class="coupon-divider"></div>
                <div class="coupon-side">
                    <div th:if="${user.stampCouponActive}" class="coupon-action">
                        <span class="coupon-status">使用中</span>
                        <span class="coupon-note">この画面を会計時に店員へお見せください</span>
                        <form th:action="@{/stampcard/cancel}" method="post">
                            <button type="submit" class="coupon-btn coupon-btn-sub">取り消す</button>
                        </form>
                    </div>
                    <div th:unless="${user.stampCouponActive}" class="coupon-action">
                        <span class="coupon-count">所持 <b th:text="${user.stampCoupon}">0</b> 枚</span>
                        <span th:if="${couponError}" th:text="${couponError}" class="coupon-note"></span>
                        <form th:if="${user.stampCoupon > 0}" th:action="@{/stampcard/use}" method="post"
                              onsubmit="return confirm('割引券を使用します。会計時に店員さんの前で押してください。よろしいですか？');">
                            <button type="submit" class="coupon-btn">使用する</button>
                        </form>
                        <span th:if="${user.stampCoupon == 0}" class="coupon-note">スタンプ20個で1枚獲得！</span>
                    </div>
                </div>
            </div>
            <!-- 会員カード -->
            <div th:class="|member-card ${
            user.memberRank == '一般' ? 'member-general' : 
            user.memberRank == 'ブロンズ' ? 'member-bronze' : 
            user.memberRank == 'シルバー' ? 'member-silver' : 
            user.memberRank == 'ゴールド' ? 'member-gold' : 'member-general'}|">
                <div class="member-card-content zenmarugothic">
                    <h5>あなたの会員ランクは</h5>
                    <h1 th:text="${user.memberRank} + 会員">一般会員</h1>
                    <h5>会員特典:
                        <span th:switch="${user.memberRank}">
                            <span th:case='一般'>なし</span>
                            <span th:case='ブロンズ'>特別メニュー１</span>
                            <span th:case='シルバー'>特別メニュー２</span>
                            <span th:case='ゴールド'>特別メニュー３</span>
                        </span>
                    </h5>
                    <h5 th:if="${user.memberRank != 'ゴールド'}">
                        次のランクまで：あと<span th:text="${nextRankProgress}">1</span>枚
                    </h5>
                    <h3>元祖ザンギ本舗 電子会員カード</h3>
                </div>
            </div>
        </div>
    </main>
    

    <!-- フッダー部 -->
	<div th:replace="~{common/Layout :: common-footer}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const qrElement = document.getElementById("qrcode");
            if (!qrElement) return;

            // データ取得（日本語もそのまま保持）
            const userInfo = {
                mail: qrElement.dataset.mail || ''
            };

            // QRコード生成（日本語もそのままエンコードされます）
            new QRious({
                element: qrElement,
                value: JSON.stringify(userInfo),
                size: 200,
                level: 'M'
            });
        });
    </script>
</body>

</html>
