<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 10秒ごとに自動リロード（リアルタイム更新） -->
    <meta http-equiv="refresh" content="10">
    <title>Outer Display</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <link href="../../static/css/w-layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
</head>
<body class="display-body">

    <!-- ヘッダーエリア -->
    <header class="display-header">
        <a href="home.html" th:href="@{/home}" class="back-link">＜戻る</a>
        <div id="current-time" class="current-time">-- : --</div>
    </header>
    
    <!-- メインコンテンツエリア -->
    <main class="display-container">
        <div class="display-grid">
            
            <!-- 左側：調理中セクション -->
            <section class="display-section cooking-section">
                <h2 class="section-title">調理中</h2>
                <div class="card-area cooking-area">
                    <!-- DBの「受付」「調理中」の注文番号を一覧表示 -->
                    <div class="number-card" th:each="item : ${displayOrders.cookingOrders}">
                        <span th:text="${item.order.orderNumber}">M0001</span>
                    </div>
                </div>
            </section>

            <!-- 右側：お呼び出し中の番号セクション -->
            <section class="display-section calling-section">
                <h2 class="section-title">お呼び出し中の番号</h2>
                <div class="card-area calling-area">
                    <!-- DBの「受取可」「呼び出し中」の注文番号を一覧表示 -->
                    <div class="number-card" th:each="item : ${displayOrders.callingOrders}">
                        <span th:text="${item.order.orderNumber}">M0002</span>
                    </div>
                </div>
            </section>

        </div>

        <!-- 右下：店舗名 -->
        <footer class="shop-footer">
            <span class="shop-name">元祖ザンギ本舗</span>
        </footer>
    </main>

    <!-- 時計更新用スクリプト -->
    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours} : ${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
