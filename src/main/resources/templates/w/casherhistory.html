<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>casherhistory</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
        <header class="header-content">
            <div class="header-btn">
                <a href="home.html"><h4>＜戻る</h4></a>
            </div>
            <div class="system-title">
                <a href=""><h2>ORDER ZANGI</h2></a>
            </div>
        </header>

    <!-- メインコンテンツ部 -->
    <main class="main-content">

        <!-- 入力項目エリア -->
        <h2>履歴</h2>
        <div class="item-block">
            <section class="">
                <form action="casherhistory">
                    <div class="search-group">
                        <label for="date">日付 <span style="color: red;">*</span></label>
                        <input for="date" id="date" name="date" required value="2026年9月8日"></label>
                    </div>
                </form>
            </section>
            <h5>総売上：</h5>
        </div>

        <!-- 一覧表示領域 -->
        <div class="item-block">
            <section>
                <table class=history-table>
                    <thead>
                        <tr>
                            <th>時刻</th>
                            <th>商品名</th>
                            <th>詳細</th>
                            <th>合計：</th>
                            <th>預かり：</th>
                            <th>おつり：</th>
                            <th>編集</th>
                        </tr>
                    </thead>
            </section>
        </div>
    </main>
</body>
</html>
