    <!-- 機能拡張用スクリプト -->
    <script>
        // 日付・時計のリアルタイム表示
        function updateClock() {
            const now = new Date();
            const dateElem = document.getElementById('date');
            const clockElem = document.querySelector('.clock');
            
            if (dateElem && clockElem) {
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                dateElem.textContent = `${year}/${month}/${day}`;
                clockElem.textContent = `${hours}:${minutes}:${seconds}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 電卓のアクション切り替えボタン機能
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggle-action-btn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const group1 = document.querySelectorAll('.action-group-1');
                    const group2 = document.querySelectorAll('.action-group-2');
                    
                    group1.forEach(el => el.classList.toggle('d-none'));
                    group2.forEach(el => el.classList.toggle('d-none'));
                });
            }
        });

        // 登録詳細モーダルの「削除」ボタン処理
        function deleteCustomer(btn) {
            if (confirm('この商品を削除してもよろしいですか？')) {
                const row = btn.closest('tr');
                if (row) {
                    row.remove();
                }
            }
        }
    </script>
