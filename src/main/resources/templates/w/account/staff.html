<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
    <div th:replace="~{common/Layout :: common-w-head}"></div>
    <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        <link href="../../static/css/account.css" th:href="@{/css/account.css}" rel="stylesheet" />
        <link href="../../static/css/account.css" th:href="@{/css/account.css}" rel="stylesheet" />
    </head>
    <body>
        <!-- ヘッダー -->
        <div th:replace="~{common/Layout :: common-header}"></div>

        <!-- メインコンテンツ -->
        <main class="col-12 col-lg-10 mx-auto p-4">
            <div class="header-container">
                <!-- 左側のタイトル -->
                <h1 class="title">従業員管理</h1>

                <!-- 右側の操作要素まとめ -->
                <div class="action-items">
                    <!-- ボタンに onclick を追加 -->
                    <button type="button" class="btn-register" onclick="openRegisterModal()">従業員登録</button>

                    <a th:href="@{/w/account/staff(page=0, sort=${sort == 'asc' ? 'desc' : 'asc'})}" 
                    class="text-dark text-decoration-none d-flex align-items-center gap-1">
                        <span>No</span>
                        <!-- 現在のソート状態に合わせて矢印アイコンを表示 -->
                        <i class="bi" th:classappend="${sort == 'desc'} ? 'bi-caret-down-fill' : 'bi-caret-up-fill'"></i>
                    </a>

                    <div class="search-box">
                        <span class="search-icon" onclick="executeSearch()" style="cursor: pointer;">
                            <img th:src="@{/img/検索マーク.png}" alt="検索">
                        </span>
                        <input type="text" id="searchInput" placeholder="検索またはURLを入力" onkeyup="filterTable()" />
                    </div>
                </div>
            </div>

            <table class="table table-hover align-middle custom-table">
                <thead>
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">メールアドレス</th>
                        <th scope="col">権限</th>
                        <th scope="col">名前</th>
                        <th scope="col">状態</th>
                        <th scope="col"></th> <!-- ボタン用 -->
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, stat : ${response.users}" class="user-row">
                        <!-- 番号 -->
                        <td th:text="${stat.count}">1</td>

                        <!-- メルアド -->
                        <td th:text="${user.mail}">zangi.staff@ben.com</td>

                        <!-- 権限 -->
                        <td th:text="${user.role}">店長</td>
                        
                        <!-- 名前 -->
                        <td th:text="${user.name}">店長</td>
                        
                        <!-- 状態 -->
                        <td th:text="${user.alive ? '無効' : '有効'}">有効</td>

                        <!-- 操作ボタン -->
                        <td class="text-end">
                            <!-- 編集ボタン -->
                            <button type="button" class="btn-edit" th:data-mail="${user.mail}" onclick="openEditModal(this)">編集</button>
                            <!-- 削除ボタン -->
                            <button type="button" class="btn-delete" th:data-mail="${user.mail}" onclick="deleteStaff(this)">削除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- ページネーションエリア -->
            <div class="d-flex justify-content-center align-items-center gap-2 mt-4" th:if="${response.totalPages > 0}">
                
                <!-- 前へ (<) ボタン -->
                <a th:href="@{/w/account/staff(page=${currentPage - 1})}" 
                class="pagination-arrow" 
                th:classappend="${currentPage == 0} ? 'disabled'">&lt;</a>

                <!-- ページ番号ボタン（1, 2, 3...） -->
                <th:block th:each="i : ${#numbers.sequence(0, response.totalPages - 1)}">
                    <a th:href="@{/w/account/staff(page=${i})}" 
                    class="pagination-num" 
                    th:classappend="${i == currentPage} ? 'btn-secondary active' : 'btn-outline-secondary'"
                    th:text="${i + 1}">1</a>
                </th:block>

                <!-- 次へ (>) ボタン -->
                <a th:href="@{/w/account/staff(page=${currentPage + 1})}" 
                class="pagination-arrow" 
                th:classappend="${currentPage + 1 == response.totalPages} ? 'disabled'">&gt;</a>
            </div>
        </main>
        <!-- 編集用モーダル画面 -->
        <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="editForm">
                        <div class="modal-header">
                            <h5 class="modal-title">従業員情報編集</h5>
                        </div>
                        <div class="modal-body">
                            <!-- メールアドレス -->
                            <div class="mb-3">
                                <label class="form-label">メールアドレス</label>
                                <input type="email" id="modalMail" name="mail" class="form-control" readonly>
                            </div>
                            <!-- 名前 -->
                            <div class="mb-3">
                                <label class="form-label">名前</label>
                                <input type="text" id="modalName" name="name" class="form-control" required>
                            </div>
                            <!-- 権限 -->
                            <div class="mb-3">
                            <label class="form-label">権限</label>
                                <select id="modalRole" name="role" class="form-control">
                                    <option value="店員">店員</option>
                                    <option value="店長">店長</option>
                                </select>
                            </div>
                            <!-- 状態 -->
                            <div class="mb-3">
                                <label class="form-label">状態</label>
                                <select id="modalAlive" name="alive" class="form-control">
                                    <option value="true">有効</option>
                                    <option value="false">無効</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" onclick="submitUpdate()">更新</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- 登録用モーダル画面 -->
        <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="registerForm">
                        <div class="modal-header">
                            <h5 class="modal-title">従業員新規登録</h5>
                        </div>
                        <div class="modal-body">
                            <!-- メールアドレス -->
                            <div class="mb-3">
                                <label class="form-label">メールアドレス</label>
                                <input type="email" name="mail" class="form-control" required>
                            </div>
                            <!-- 名前 -->
                            <div class="mb-3">
                                <label class="form-label">名前</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <!-- 権限 -->
                            <div class="mb-3">
                                <label class="form-label">権限</label>
                                <select name="role" class="form-control">
                                    <option value="店員">店員</option>
                                    <option value="店長">店長</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" onclick="submitRegister()">登録</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            let editModal;
            let registerModal;

            document.addEventListener('DOMContentLoaded', function() {
                editModal = new bootstrap.Modal(document.getElementById('editModal'));
                registerModal = new bootstrap.Modal(document.getElementById('registerModal'));
            });

            function openEditModal(button) {
                const mail = button.getAttribute('data-mail');

                fetch(`/w/account/staff/detail?mail=${encodeURIComponent(mail)}`)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('modalMail').value = data.mail;
                        document.getElementById('modalName').value = data.name;
                        document.getElementById('modalRole').value = data.role;
                        document.getElementById('modalAlive').value = String(data.alive);
                        
                        editModal.show();
                    })
                    .catch(error => console.error('Error:', error));
            }

            // 更新
            function submitUpdate() {
                const form = document.getElementById('editForm');
                const formData = new FormData(form);
                const { token, header } = getCsrfInfo();

                fetch('/w/account/staff/update', {
                    method: 'POST',
                    headers: {
                        [header]: token
                    },
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        alert('変更を保存しました');
                        location.reload();
                    } else {
                        alert('変更できませんでした。もう一度お試しください。');
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            // 削除ボタン押下時
            function deleteStaff(button) {
                const mail = button.getAttribute('data-mail');
                const { token, header } = getCsrfInfo();

                if (confirm('このユーザを削除してもよろしいですか。')) {
                    fetch(`/w/account/staff/delete?mail=${encodeURIComponent(mail)}`, {
                        method: 'POST',
                        headers: {
                            [header]: token
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            alert('変更を保存しました。');
                            location.reload();
                        } else {
                            alert('変更できませんでした。もう一度お試しください。');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('変更できませんでした。もう一度お試しください。');
                    });
                }
            }

            // 登録モーダルを開く
            function openRegisterModal() {
                document.getElementById('registerForm').reset();
                registerModal.show();
            }

            // 登録処理
            function submitRegister() {
                const form = document.getElementById('registerForm');
                
                // 未入力（required）チェック
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const formData = new FormData(form);
                const { token, header } = getCsrfInfo();

                fetch('/w/account/staff/register', {
                    method: 'POST',
                    headers: {
                        [header]: token
                    },
                    body: formData
                })
                .then(response => {
                    if (response.status === 200) {
                        alert('変更を保存しました。');
                        location.reload();
                    } else if (response.status === 409) {
                        alert('すでに登録済みのアカウントです。');
                    } else {
                        alert('ユーザの登録に失敗しました。もう一度お試しください。');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('ユーザの登録に失敗しました。もう一度お試しください。');
                });
            }

            // 検索処理
            function filterTable() {
                const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
                const rows = document.querySelectorAll('.user-row');

                rows.forEach(row => {
                    const rowText = row.textContent.toLowerCase();
                    if (rowText.includes(keyword)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            }

            // CSRFトークンとヘッダー名を取得する
            function getCsrfInfo() {
                const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
                const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");
                return { token, header };
            }
        </script>
    </body>
</html>
