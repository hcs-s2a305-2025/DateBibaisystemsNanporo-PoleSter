<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta th:name="_csrf" th:content="${_csrf.token}"/>
        <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
        <title>利用者管理</title>
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link href="../static/css/style.css" th:href="@{/css/style.css}" rel="stylesheet" />

        <link href="../../static/css/account.css" th:href="@{/css/account.css}" rel="stylesheet" />
    </head>
    <body>
        <header class="header-content">
            <div class="header-btn">
                <h3><a href="">＜戻る</a></h3>
            </div>
            <div class="header-item">
                <p>ログイン：店長</p>
            </div>
            <div class="system-title">
                <a href="/" th:href="@{/}">
                    <h2>ORDER ZANGI</h2>
                </a>
            </div>
            <div class="header-item d-flex justify-content-end">
                <div></div>
            </div>
            <div class="header-btn">
                <h5 id="date"></h5>
                <h5 class="clock"></h5>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="col-12 col-lg-10 mx-auto p-4">
            <div class="header-container">
                <!-- 左側のタイトル -->
                <h1 class="title">利用者管理</h1>

                <!-- 右側の操作要素まとめ -->
                <div class="action-items">
                    <a th:href="@{/w/account/customer(page=0, sort=${sort == 'asc' ? 'desc' : 'asc'})}" 
                    class="text-dark text-decoration-none d-flex align-items-center gap-1">
                        <span>No</span>
                        <!-- 現在のソート状態に合わせて矢印アイコンを表示 -->
                        <i class="bi" th:classappend="${sort == 'desc'} ? 'bi-caret-down-fill' : 'bi-caret-up-fill'"></i>
                    </a>

                    <div class="search-box">
                        <span class="search-icon" onclick="executeSearch()" style="cursor: pointer;">
                            <img th:src="@{/img/検索マーク.png}" alt="検索">
                        </span>
                        <input type="text" id="searchInput" placeholder="検索またはURLを入力" onkeyup="filterTable()" />
                    </div>
                </div>
            </div>

            <table class="table table-hover align-middle custom-table">
                <thead>
                    <tr>
                        <th scope="col">No</th>
                        <th scope="col">メールアドレス</th>
                        <th scope="col">会員ランク</th>
                        <th scope="col">キャンセル回数</th>
                        <th scope="col">名前</th>
                        <th scope="col">状態</th>
                        <th scope="col"></th> <!-- ボタン用 -->
                    </tr>
                </thead>
                <tbody>
                    <!-- <tr> -->
                        <!-- <th>1</th> -->
                        <!-- <th>zangui@ben.com</th> -->
                        <!-- <th>ゴールド</th> -->
                        <!-- <th>1</th> -->
                        <!-- <th scope="col">慚愧弁之助</th> -->
                        <!-- <th scope="col">有効</th> -->
                        <!-- 操作ボタン -->
                        <!-- <th class="text-end"> -->
                            <!-- 停止ボタン -->
                            <!-- <button type="button">停止</button> -->
                            <!-- 削除ボタン -->
                            <!-- <button type="button">削除</button> -->
                        <!-- </th> -->
                    <!-- </tr> -->
                    <tr th:each="user, stat : ${response.users}" class="user-row">
                        <!-- 番号 -->
                        <td th:text="${stat.count}">1</td>

                        <!-- メルアド -->
                        <td th:text="${user.mail}">zangui@ben.com</td>

                        <!-- 会員ランク -->
                        <td th:text="${user.memberRank}">ゴールド</td>

                        <!-- キャンセル回数 -->
                        <td th:text="${user.cancelCount}">1</td>
                        
                        <!-- 名前 -->
                        <td th:text="${user.name}">慚愧弁之助</td>
                        
                        <!-- 状態 -->
                        <td th:text="${user.alive ? '無効' : '有効'}">有効</td>

                        <!-- 操作ボタン -->
                        <td class="text-end">
                            <!-- 停止ボタン -->
                            <button type="button" 
                                class="btn-stop" 
                                th:if="${!user.alive}" 
                                th:data-mail="${user.mail}" 
                                onclick="stopCustomer(this)">停止</button>

                            <!-- 解除ボタン -->
                            <button type="button" 
                                class="btn-resume" 
                                th:if="${user.alive}" 
                                th:data-mail="${user.mail}" 
                                onclick="resumeCustomer(this)">解除</button>

                            <!-- 削除ボタン -->
                            <button type="button" class="btn-delete" th:data-mail="${user.mail}" onclick="deleteCustomer(this)">削除</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- ページネーションエリア -->
            <div class="d-flex justify-content-center align-items-center gap-2 mt-4" th:if="${response.totalPages > 0}">
                
                <!-- 前へ (<) ボタン -->
                <a th:href="@{/w/account/customer(page=${currentPage - 1})}" 
                class="pagination-arrow" 
                th:classappend="${currentPage == 0} ? 'disabled'">&lt;</a>

                <!-- ページ番号ボタン（1, 2, 3...） -->
                <th:block th:each="i : ${#numbers.sequence(0, response.totalPages - 1)}">
                    <a th:href="@{/w/account/customer(page=${i})}" 
                    class="pagination-num" 
                    th:classappend="${i == currentPage} ? 'btn-secondary active' : 'btn-outline-secondary'"
                    th:text="${i + 1}">1</a>
                </th:block>

                <!-- 次へ (>) ボタン -->
                <a th:href="@{/w/account/customer(page=${currentPage + 1})}" 
                class="pagination-arrow" 
                th:classappend="${currentPage + 1 == response.totalPages} ? 'disabled'">&gt;</a>
            </div>
        </main>
        <script>
        let editModal;

        document.addEventListener('DOMContentLoaded', function() {
            // Bootstrapモーダルの初期化
            editModal = new bootstrap.Modal(document.getElementById('editModal'));
        });

        // 検索処理
        function filterTable() {
            // 入力値を取得
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            // すべての行を取得
            const rows = document.querySelectorAll('.user-row');

            // 各行と入力値を比較
            rows.forEach(row => {
                const rowText = row.textContent.toLowerCase();
                
                // 含まれていれば表示、含まれていなければ非表示
                if (rowText.includes(keyword)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // 削除ボタン押下時
        function deleteCustomer(button) {
            const mail = button.getAttribute('data-mail');

            // CSRFトークンを取得
            const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
            const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

            // 確認ダイアログを表示
            if (confirm('このユーザを削除してもよろしいですか。')) {
                fetch(`/w/account/customer/delete?mail=${encodeURIComponent(mail)}`, {
                    method: 'POST',
                    headers: {
                        [header]: token // ヘッダーにCSRFトークンをセット
                    }
                })
                .then(response => {
                    if (response.ok) {
                        alert('変更を保存しました。');
                        location.reload();
                    } else {
                        alert('変更できませんでした。もう一度お試しください。');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('変更できませんでした。もう一度お試しください。');
                });
            }
        }

        // CSRFトークンを取得する共通処理
        function getCsrfHeaders() {
            const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
            const header = document.querySelector("meta[name='_csrf_header']").getAttribute("content");
            return { [header]: token };
        }

        // 停止ボタン押下時
        function stopCustomer(button) {
            const mail = button.getAttribute('data-mail');
            if (!confirm('このユーザの利用を停止してもよろしいですか。')) return;

            fetch(`/w/account/customer/stop?mail=${encodeURIComponent(mail)}`, {
                method: 'POST',
                headers: getCsrfHeaders()
            })
            .then(response => {
                if (response.ok) {
                    alert('変更を保存しました。');
                    location.reload();
                } else {
                    alert('変更できませんでした。もう一度お試しください。');
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // 解除ボタン押下時
        function resumeCustomer(button) {
            const mail = button.getAttribute('data-mail');
            if (!confirm('このユーザの利用停止を解除してもよろしいですか。')) return;

            fetch(`/w/account/customer/resume?mail=${encodeURIComponent(mail)}`, {
                method: 'POST',
                headers: getCsrfHeaders()
            })
            .then(response => {
                if (response.ok) {
                    alert('変更を保存しました。');
                    location.reload();
                } else {
                    alert('変更できませんでした。もう一度お試しください。');
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // 検索処理
        function filterTable() {
            // 入力値を取得
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            // すべての行を取得
            const rows = document.querySelectorAll('.user-row');

            // 各行と入力値を比較
            rows.forEach(row => {
                const rowText = row.textContent.toLowerCase();
                
                // 含まれていれば表示、含まれていなければ非表示
                if (rowText.includes(keyword)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
        </script>
    </body>
</html>
