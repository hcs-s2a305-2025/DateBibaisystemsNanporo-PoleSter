<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 10秒ごとに自動リロード（リアルタイム更新） -->
    <meta http-equiv="refresh" content="10">
    <title>Outer Display</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <link href="../../static/css/display.css" th:href="@{/css/display.css}" rel="stylesheet" />
</head>
<body>

    <!-- クリーム色の上部ヘッダーバー -->
    <div class="header">
        <a href="/w/home" class="back-btn">＜戻る</a>
        <div class="current-time" id="clock">14 : 20</div>
    </div>

    <!-- ライトグレーのメインコンテンツエリア -->
    <div class="grid-container">
        <!-- 注文カード一覧 -->
        <div th:each="order : ${orders}" class="card" 
             th:data-get-time="${#dates.format(order.getTime, 'yyyy-MM-dd HH:mm:ss')}"
             th:data-register-time="${#dates.format(order.registerTime, 'yyyy-MM-dd HH:mm:ss')}">
            
            <div class="card-header">
                受付番号 <span class="order-number" th:text="${order.orderNumber}">M72</span>
            </div>

            <div class="card-body">
                <!-- 商品ループ -->
                <div th:each="item, stat : ${order.items}" 
                     class="item-group" 
                     th:classappend="${item.setGoodsId != null} ? 'is-set' : ''">
                    
                    <div class="item-title">
                        <span th:text="'・ ' + ${item.goodsName}">・ 元祖ザンギ弁当（5個）</span>
                        <span th:text="'x' + ${item.count}">x1</span>
                    </div>

                    <!-- オプション（カスタム） -->
                    <ul class="custom-list" th:if="${item.customName}">
                        <li th:text="'・ ' + ${item.customName}">・ ごはん特盛</li>
                    </ul>
                </div>
            </div>

            <div class="card-footer">
                <form th:action="@{/w/innerdisplay/complete}" method="post">
                    <input type="hidden" name="orderId" th:value="${order.orderId}" />
                    <button type="submit" class="complete-btn">完了</button>
                </form>

                <div class="time-info">
                    <span>受付 <span th:text="${#dates.format(order.registerTime, 'HH : mm')}">13 : 50</span></span>
                    <span>経過 <span class="elapsed-time">00 : 00</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 現在時刻の時計更新
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours} : ${minutes}`;
        }

        // カードの背景色・枠色および経過時間の計算
        function updateCards() {
            const now = new Date();
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const getTimeStr = card.getAttribute('data-get-time');
                const regTimeStr = card.getAttribute('data-register-time');

                // 1. 受取予定時間からの経過（遅延）計算して色付け
                if (getTimeStr) {
                    const getTime = new Date(getTimeStr.replace(/-/g, '/'));
                    const delayMinutes = (now - getTime) / (1000 * 60);

                    card.classList.remove('status-normal', 'status-warning', 'status-danger');

                    if (delayMinutes >= 15) {
                        card.classList.add('status-danger');  /* 15分以上：赤 */
                    } else if (delayMinutes >= 5) {
                        card.classList.add('status-warning'); /* 5分〜15分：黄 */
                    } else {
                        card.classList.add('status-normal');  /* 通常：白 */
                    }
                }

                // 2. 注文受付（注文完了）からの経過時間表示
                if (regTimeStr) {
                    const regTime = new Date(regTimeStr.replace(/-/g, '/'));
                    const elapsedMs = Math.max(0, now - regTime);
                    const elapsedHrs = String(Math.floor(elapsedMs / (1000 * 60 * 60))).padStart(2, '0');
                    const elapsedMins = String(Math.floor((elapsedMs % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                    
                    const elapsedElem = card.querySelector('.elapsed-time');
                    if (elapsedElem) {
                        elapsedElem.innerText = `${elapsedHrs} : ${elapsedMins}`;
                    }
                }
            });
        }

        // 定期実行
        setInterval(updateClock, 1000);
        setInterval(updateCards, 10000);

        // 初期化実行
        updateClock();
        updateCards();
    </script>
</body>
</body>
</html>
