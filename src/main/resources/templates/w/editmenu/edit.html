<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>casherhistory</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../../../static/css/w-layout.css" th:href="@{/css/w-layout.css}" rel="stylesheet" />
    <link href="../../../static/css/edit.css" th:href="@{/css/edit.css}" rel="stylesheet" />
</head>

<body>

    <!-- ヘッダー部分 (共通レイアウト) -->
    <header class="header-content">
        <div class="header-btn">
            <h3><a href="">＜戻る</a></h3>
        </div>
        <div class="header-item">
            <p>ログイン：店長</p>
        </div>
        <div class="system-title">
            <a href="/" th:href="@{/}">
                <h2>ORDER ZANGI</h2>
            </a>
        </div>
        <div class="header-item d-flex justify-content-end">
            <div></div>
        </div>
        <div class="header-btn">
            <h5 id="date"></h5>
            <h5 class="clock"></h5>
        </div>
    </header>

    <main class="container my-4 edit-container">
        
        <form class="product-edit-wrapper bg-white p-4 rounded shadow-sm" th:action="@{/product/update}" method="post">

            <!-- 画像 + 基本情報入力領域 -->
            <div class="row mb-5 product-basic-info">
                <!-- 商品画像 -->
                <div class="col-md-5 mb-3 mb-md-0 product-image-area">
                    <img src="../../../static/img/ザンギ弁当.jpg" alt="元祖ザンギ弁当" class="img-fluid rounded border w-100 object-fit-cover" style="max-height: 300px;">
                </div>

                <div class="col-md-7 product-input-area d-flex flex-column justify-content-center">
                    <!-- 画像アップロード -->
                    <div class="input-group mb-4">
                        <input class="form-control" type="file" id="referenceBtn" name="referenceBtn" accept="image/*">
                        <div class="form-text">JPG, PNG（最大5MB）</div>
                    </div>

                    <!-- 商品名入力 -->
                    <div class="input-group mb-4 align-items-center">
                        <input type="text" class="form-control fw-bold fs-5" name="productName" value="元祖ザンギ弁当（5個）">
                    </div>

                    <!-- 価格 & 注文可能ランク -->
                    <div class="d-flex flex-wrap gap-4 align-items-center">
                        <div class="input-group w-auto">
                            <span class="input-group-text">￥</span>
                            <input type="text" class="form-control fw-bold" name="price" value="780" style="max-width: 100px;">
                        </div>
                        <div class="d-flex align-items-center">
                            <label for="rank" class="form-label mb-0 me-2 text-nowrap fw-bold">注文可能ランク：</label>
                            <select id="rank" name="rank" class="form-select w-auto">
                                <option value="general">一般</option>
                                <option value="bronz">ブロンズ</option>
                                <option value="silver">シルバー</option>
                                <option value="gold">ゴールド</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ごはんの量 オプション -->
            <div class="option-section mb-4">
                <div class="fw-bold mb-2">ごはんの量：</div>
                <div class="d-flex overflow-x-auto gap-2 pb-2 option-scroll-area">
                    
                    <div class="card flex-shrink-0 text-center option-card" style="width: 100px;"
                        th:each="rice : ${riceOptions}"
                        data-bs-toggle="modal" 
                        data-bs-target="#optionModal"
                        data-type="rice"
                        th:data-id="${rice.id}" 
                        th:data-name="${rice.name}" 
                        th:data-price="${rice.price}">
                        <div class="card-body p-2">
                            <div class="fw-bold small text-truncate" th:text="${rice.name}">小盛り</div>
                            <div class="small" th:text="${'￥ ' + rice.price}">￥ -50</div>
                        </div>
                    </div>

                    <!-- 追加ボタン -->
                    <button type="button" class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center justify-content-center" style="width: 60px;"
                            data-bs-toggle="modal" 
                            data-bs-target="#optionModal"
                            data-type="rice"
                            data-id="" 
                            data-name="" 
                            data-price="">
                        <i class="bi bi-plus-lg fs-4"></i>
                    </button>
                </div>
            </div>

            <!-- ソース オプション -->
            <div class="option-section mb-5">
                <div class="fw-bold mb-2">ソース：</div>
                <div class="d-flex overflow-x-auto gap-2 pb-2 option-scroll-area">
                    
                    <div class="card flex-shrink-0 text-center option-card" style="width: 120px;"
                        th:each="sauce : ${sauceOptions}"
                        data-bs-toggle="modal" 
                        data-bs-target="#optionModal"
                        data-type="sauce"
                        th:data-id="${sauce.id}" 
                        th:data-name="${sauce.name}" 
                        th:data-price="${sauce.price}">
                        <div class="card-body p-2">
                            <div class="fw-bold small text-truncate" th:text="${sauce.name}">おろしポン酢</div>
                            <div class="text-success small" th:text="${'￥ ' + sauce.price}">￥ 50</div>
                        </div>
                    </div>
                    
                    <!-- 追加ボタン -->
                    <button type="button" class="btn btn-outline-secondary flex-shrink-0 d-flex align-items-center justify-content-center" style="width: 60px;"
                            data-bs-toggle="modal" 
                            data-bs-target="#optionModal"
                            data-type="sauce"
                            data-id="" 
                            data-name="" 
                            data-price="">
                        <i class="bi bi-plus-lg fs-4"></i>
                    </button>
                </div>
            </div>

            <hr class="mb-4">

            <!-- 商品分類 & アレルゲン -->
            <div class="row mb-5">
                <!-- 商品分類 セレクト -->
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="fw-bold mb-2">商品分類：</label>
                    <select class="form-select" name="categoryId">
                        <option value="">分類を選択</option>
                        <option th:each="category : ${categories}" 
                                th:value="${category.id}" 
                                th:text="${category.name}">ザンギ弁当</option>
                    </select>
                </div>

                <!-- アレルゲン-->
                <div class="col-md-6">
                    <label class="fw-bold mb-2">アレルゲン：</label>
                    <div>
                        <button type="button" class="btn btn-outline-secondary mb-2" data-bs-toggle="modal" data-bs-target="#allergenModal">
                            <i class="bi bi-list-check me-1"></i>アレルゲンを選択
                        </button>
                        <!-- 選択結果の表示領域 -->
                        <div id="allergenDisplayArea" class="border rounded p-2 bg-light text-muted small" style="min-height: 42px;">
                            選択されていません
                        </div>
                    </div>
                </div>
            </div>

            <!-- 下部ボタン領域 -->
            <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-primary px-4 py-2 fw-bold">変更を保存</button>
                <button type="button" class="btn btn-outline-secondary px-4 py-2" onclick="history.back()">変更を破棄して戻る</button>
            </div>


            <!-- ===== モーダル ===== -->

            <!-- 1. オプション編集・新規登録・削除用モーダル -->
            <div class="modal fade" id="optionModal" tabindex="-1" aria-labelledby="optionModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="optionModalLabel">オプションの設定</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                        </div>
                        <div class="modal-body">
                            <!-- 裏で保持するデータ -->
                            <input type="hidden" id="modalOptionType" name="optionType">
                            <input type="hidden" id="modalOptionId" name="optionId">

                            <div class="mb-3">
                                <label for="modalOptionName" class="form-label fw-bold">オプション名</label>
                                <input type="text" class="form-control" id="modalOptionName" placeholder="例: 大盛り">
                            </div>
                            <div class="mb-3">
                                <label for="modalOptionPrice" class="form-label fw-bold">価格変動（円）</label>
                                <div class="input-group">
                                    <span class="input-group-text">￥</span>
                                    <input type="number" class="form-control" id="modalOptionPrice" placeholder="0">
                                </div>
                                <div class="form-text text-muted">※安くなる場合は -50 のようにマイナスをつけてください。</div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <!--削除ボタン-->
                            <button type="button" class="btn btn-danger me-auto" id="btnDeleteOption">
                                <i class="bi bi-trash3 me-1"></i>削除
                            </button>
                            
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                            <button type="button" class="btn btn-primary" id="btnSaveOption">保存</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. アレルゲン選択用モーダル -->
            <div class="modal fade" id="allergenModal" tabindex="-1" aria-labelledby="allergenModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="allergenModalLabel">アレルゲンの選択</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row g-2">
                                <!-- Thymeleafで29品目をループ出力-->
                                <div class="col-6 col-sm-4" th:each="allergen : ${allergens}">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" name="allergenIds" th:value="${allergen.id}" th:id="'allergen_' + ${allergen.id}" th:data-name="${allergen.name}">
                                        <label class="form-check-label small" th:for="'allergen_' + ${allergen.id}" th:text="${allergen.name}"></label>
                                    </div>
                                </div>

                                <!-- ダミーデータ -->

                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a1" data-name="小麦">
                                        <label class="form-check-label small" for="a1">小麦</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a2" data-name="えび">
                                        <label class="form-check-label small" for="a2">えび</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a3" data-name="かに">
                                        <label class="form-check-label small" for="a3">かに</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a4" data-name="くるみ">
                                        <label class="form-check-label small" for="a4">くるみ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a5" data-name="そば">
                                        <label class="form-check-label small" for="a5">そば</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a6" data-name="卵">
                                        <label class="form-check-label small" for="a6">卵</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a7" data-name="乳">
                                        <label class="form-check-label small" for="a7">乳</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a8" data-name="落花生">
                                        <label class="form-check-label small" for="a8">落花生</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a9" data-name="カシューナッツ">
                                        <label class="form-check-label small" for="a9">カシューナッツ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a10" data-name="アーモンド">
                                        <label class="form-check-label small" for="a10">アーモンド</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a11" data-name="アワビ">
                                        <label class="form-check-label small" for="a11">アワビ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a12" data-name="いか">
                                        <label class="form-check-label small" for="a12">いか</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a13" data-name="いくら">
                                        <label class="form-check-label small" for="a13">いくら</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a14" data-name="オレンジ">
                                        <label class="form-check-label small" for="a14">オレンジ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a15" data-name="キウイフルーツ">
                                        <label class="form-check-label small" for="a15">キウイフルーツ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a16" data-name="牛肉">
                                        <label class="form-check-label small" for="a16">牛肉</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a17" data-name="ごま">
                                        <label class="form-check-label small" for="a17">ごま</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a18" data-name="さけ">
                                        <label class="form-check-label small" for="a18">さけ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a19" data-name="さば">
                                        <label class="form-check-label small" for="a19">さば</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a20" data-name="大豆">
                                        <label class="form-check-label small" for="a20">大豆</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a21" data-name="鶏肉">
                                        <label class="form-check-label small" for="a21">鶏肉</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a22" data-name="バナナ">
                                        <label class="form-check-label small" for="a22">バナナ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a23" data-name="ピスタチオ">
                                        <label class="form-check-label small" for="a23">ピスタチオ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a24" data-name="豚肉">
                                        <label class="form-check-label small" for="a24">豚肉</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a25" data-name="マカダミアナッツ">
                                        <label class="form-check-label small" for="a25">マカダミアナッツ</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a26" data-name="もも">
                                        <label class="form-check-label small" for="a26">もも</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a27" data-name="やまいも">
                                        <label class="form-check-label small" for="a27">やまいも</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a28" data-name="りんご">
                                        <label class="form-check-label small" for="a28">りんご</label>
                                    </div>
                                </div>
                                <div class="col-6 col-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input allergen-checkbox" type="checkbox" id="a29" data-name="ゼラチン">
                                        <label class="form-check-label small" for="a29">ゼラチン</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="btnApplyAllergen">確定する</button>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </main>

    <!-- モーダル制御用JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            
            /* ==================================================
                1. オプション（ごはん・ソース）モーダルの制御
            ================================================== */
            var optionModal = document.getElementById('optionModal');
            
            optionModal.addEventListener('show.bs.modal', function (event) {
                var button = event.relatedTarget;
                var type = button.getAttribute('data-type');
                var id = button.getAttribute('data-id');
                var name = button.getAttribute('data-name');
                var price = button.getAttribute('data-price');
                
                var modalTitle = optionModal.querySelector('.modal-title');
                var inputType = optionModal.querySelector('#modalOptionType');
                var inputId = optionModal.querySelector('#modalOptionId');
                var inputName = optionModal.querySelector('#modalOptionName');
                var inputPrice = optionModal.querySelector('#modalOptionPrice');
                var btnDelete = optionModal.querySelector('#btnDeleteOption');

                var typeLabel = (type === 'rice') ? 'ごはんの量' : 'ソース';

                // モーダルの入力欄に値をセット
                inputType.value = type || '';
                inputId.value = id || '';
                inputName.value = name || '';
                inputPrice.value = price || '';

                // 新規か既存かで削除ボタンの表示を切り替え
                if (id) {
                    modalTitle.textContent = typeLabel + ' の編集';
                    btnDelete.style.display = 'block';
                } else {
                    modalTitle.textContent = typeLabel + ' の新規追加';
                    btnDelete.style.display = 'none'; //
                }
            });

            // オプション保存ボタンの処理
            document.getElementById('btnSaveOption').addEventListener('click', function() {
                alert('保存します');
                var bootstrapModal = bootstrap.Modal.getInstance(optionModal);
                bootstrapModal.hide();
            });

            // オプション削除ボタンの処理
            document.getElementById('btnDeleteOption').addEventListener('click', function() {
                var optionName = document.getElementById('modalOptionName').value;
                if(confirm('「' + optionName + '」を削除しますか？')) {
                    alert('削除します');
                    var bootstrapModal = bootstrap.Modal.getInstance(optionModal);
                    bootstrapModal.hide();
                }
            });

            /* ==================================================
                2. アレルゲン選択モーダルの制御
            ================================================== */
            document.getElementById('btnApplyAllergen').addEventListener('click', updateAllergenDisplay);

            function updateAllergenDisplay() {
                // チェックされているチェックボックスを取得
                var checkboxes = document.querySelectorAll('.allergen-checkbox:checked');
                var displayArea = document.getElementById('allergenDisplayArea');
                
                if (checkboxes.length > 0) {
                    // チェックされた要素から data-name を抽出し、バッジHTMLを作成
                    var names = Array.from(checkboxes).map(function(cb) {
                        return '<span class="badge bg-secondary me-1 mb-1 p-2">' + cb.getAttribute('data-name') + '</span>';
                    });
                    // 表示エリアに流し込む
                    displayArea.innerHTML = names.join('');
                    displayArea.classList.remove('text-muted');
                } else {
                    // チェックがない場合
                    displayArea.innerHTML = '選択されていません';
                    displayArea.classList.add('text-muted');
                }
            }

            // 初期表示時（編集画面を開いた時）にも、すでにチェックが入っているものを画面に反映させる
            updateAllergenDisplay();
        });
