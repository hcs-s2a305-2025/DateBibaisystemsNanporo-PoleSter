<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{common/Layout :: common-w-head}"></div>
    <link href="../../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <div th:replace="~{common/Layout :: common-header}"></div>
    
    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <!-- タイトル & 新規商品追加ボタン -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>メニュー編集</h2>
                <a th:href="@{/w/editmenu/edit}" class="btn btn-danger btn-add-product px-4 py-2">
                    新規商品追加
                </a>
            </div>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(menuList)}">
                <h5 class="item-block-text">メニューが存在しません。</h5>
            </div>

            <!-- 予約データが存在する場合 -->
            <div class="item-block menu-item"
                th:each="item : ${menuList}"
                th:onclick="|location.href='@{/w/editmenu/edit(goodsId=${item.goodsId})}'|">

                <div class="name-block">
                    <!-- 商品名 -->
                    <h3 th:text="${item.goodsName}">元祖ザンギ弁当（3個）</h3>
                    
                    <!-- 金額 -->
                    <h5 class="text-secondary" th:text="${#numbers.formatInteger(item.price, 1, 'COMMA') + '円'}">780円</h5>                
                </div>

                <!-- アクションボタンエリア（カードクリックの遷移と重複させないよう event.stopPropagation() を設定） -->
                <div class="action-block d-flex align-items-center me-3" onclick="event.stopPropagation();">
                    <form th:action="@{/w/editmenu/toggle-sold-out}" method="post">
                        <input type="hidden" name="goodsId" th:value="${item.goodsId}" />
                        <!-- 次に変更したいステータスを送信 -->
                        <input type="hidden" name="soldOut" th:value="${!item.soldOut}" />

                        <!-- 販売中の場合：販売停止ボタン -->
                        <button type="submit" 
                                class="btn btn-outline-danger btn-sm" 
                                th:if="${!item.soldOut}"
                                onclick="return confirm('この商品を販売停止にしますか？');">
                            販売停止
                        </button>

                        <!-- 販売停止中の場合：販売再開ボタン -->
                        <button type="submit" 
                                class="btn btn-outline-success btn-sm" 
                                th:if="${item.soldOut}"
                                onclick="return confirm('この商品の販売を再開しますか？');">
                            販売再開
                        </button>
                    </form>
                </div>
                <!-- 商品画像 -->
                <img src="../../static/img/ザンギ弁当.jpg" th:src="@{${item.photo}}" alt="商品画像">
            </div>
        </div>
    </main>

    <!-- ソート用カテゴリ -->
    <div class="foot-menu">
        <div class="foot-menu-select">
            <!-- 「すべて」タブ -->
            <a th:href="@{/w/editmenu}" 
            class="foot-menu-select-button text-decoration-none"  
            th:classappend="${selectedPrefix == null || selectedPrefix == ''} ? 'active-category' : 'text-secondary'">
                すべて
            </a>

            <!-- 各カテゴリタブ（動的繰り返し表示） -->
            <a th:each="category : ${categoryList}" 
            th:href="@{/w/editmenu(prefix=${category.id})}" 
            class="foot-menu-select-button text-decoration-none" 
            th:classappend="${selectedPrefix == category.id} ? 'active-category' : 'text-secondary'"
            th:text="${category.name}">
                カテゴリ名
            </a>
        </div>
    </div>

</body>

</html>
