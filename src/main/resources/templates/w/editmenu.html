<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn">
            <h3><a href="">＜戻る</a></h3>
        </div>
        <div class="header-item">
            <p>ログイン：店長</p>
        </div>
        <div class="system-title">
            <a href="/" th:href="@{/}">
                <h2>ORDER ZANGI</h2>
            </a>
        </div>
        <div class="header-item d-flex justify-content-end">
            <div></div>
        </div>
        <div class="header-btn">
            <h5 id="date"></h5>
            <h5 class="clock"></h5>
        </div>
    </header>
    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <!-- タイトル & 新規商品追加ボタン -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>メニュー編集</h2>
                <a th:href="@{/w/editmenu/edit}" class="btn btn-danger btn-add-product px-4 py-2">
                    新規商品追加
                </a>
            </div>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(menuList)}">
                <h5 class="item-block-text">メニューが存在しません。</h5>
            </div>

            <!-- 予約データが存在する場合 -->
            <div class="item-block menu-item"
                th:each="item : ${menuList}"
                th:onclick="|location.href='@{/w/editmenu/edit(goodsId=${item.goodsId})}'|">

                <div class="name-block">
                    <!-- 商品名 -->
                    <h3 th:text="${item.goodsName}">元祖ザンギ弁当（3個）</h3>
                    
                    <!-- 金額 -->
                    <h5 class="text-secondary" th:text="${#numbers.formatInteger(item.price, 1, 'COMMA') + '円'}">780円</h5>                
                </div>

                <!-- 削除ボタンエリア（カードクリックの遷移と重複させないよう event.stopPropagation() を設定） -->
                <div class="action-block d-flex align-items-center me-3" onclick="event.stopPropagation();">
                    <form th:action="@{/editmenu/delete}" method="post" onsubmit="return confirm('本当に削除しますか？');">
                        <input type="hidden" name="goodsId" th:value="${item.goodsId}" />
                        <button type="submit" class="btn btn-outline-secondary btn-sm">削除</button>
                    </form>
                </div>

                <!-- 商品画像 -->
                <img src="../../static/img/ザンギ弁当.jpg" th:src="@{${item.photo}}" alt="商品画像">
            </div>
        </div>
    </main>

    <!-- ソート用カテゴリ（th:eachで動的取得） -->
    <div class="foot-menu">
        <div class="foot-menu-select">
            <!-- 「すべて」タブ -->
            <a href="/editmenu" th:href="@{/editmenu}" 
                class="foot-menu-select-button text-decoration-none"  
                th:classappend="${selectedCategoryId == null} ? '' : 'text-secondary'"
            >すべて</a>

            <!-- 各カテゴリタブ（th:eachでループ表示） -->
            <a href="#" th:href="@{/menu(categoryId=${category.id})}" 
                class="foot-menu-select-button text-decoration-none" 
                th:each="category : ${categoryList}" 
                th:classappend="${selectedCategoryId == category.id} ? '' : 'text-secondary'"
                th:text="${category.name}">ザンギ弁当</a>
        </div>
    </div>

</body>

</html>
