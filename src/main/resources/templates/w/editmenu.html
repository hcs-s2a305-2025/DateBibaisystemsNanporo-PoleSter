<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn">
            <h3><a href="">＜戻る</a></h3>
        </div>
        <div class="header-item">
            <p>ログイン：店長</p>
        </div>
        <div class="system-title">
            <a href="/" th:href="@{/}">
                <h2>ORDER ZANGI</h2>
            </a>
        </div>
        <div class="header-item d-flex justify-content-end">
            <div></div>
        </div>
        <div class="header-btn">
            <h5 id="date"></h5>
            <h5 class="clock"></h5>
        </div>
    </header>
    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <h2>メニュー一覧</h2>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(~List)}">
                <h5 class="item-block-text">メニューが存在しません。</h5>
            </div>

            <!-- 予約データが存在する場合 -->
            <div class="item-block menu-item" th:each="item : ${~List}">
                <div class="name-block">
                    <!-- 商品名 -->
                    <h3 th:text="${item.name}">元祖ザンギ弁当（3個）</h3>
                    
                    <!-- 金額 -->
                    <h5 class="text-secondary" th:text="${#numbers.formatInteger(item.price, 1, 'COMMA') + '円'}">780円</h5>                
                </div>

                <!-- 商品画像 -->
                <img src="../../static/img/ザンギ弁当.jpg" th:src="@{${item.imageUrl}}" alt="商品画像">
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div class="footer-btn">
            <a href=""><img style="width: 36px; height: 53px;" src="../../static/img/ホームボタン.png" alt="ホーム"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 48px; height: 53px;"  src="../../static/img/メニューボタン.png" alt="メニュー"></a>
        </div>
        <div class="footer-btn" style="position: relative; top: -20px;">
            <a href=""><img style="width: 77px; height: 96px;" src="../../static/img/予約ボタン.png" alt="予約"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 33px; height: 51px;" src="../../static/img/履歴ボタン.png" alt="履歴"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 60px; height: 51px;" src="../../static/img/マイページボタン.png" alt="マイページ"></a>
        </div>
    </footer>
</body>

</html>
