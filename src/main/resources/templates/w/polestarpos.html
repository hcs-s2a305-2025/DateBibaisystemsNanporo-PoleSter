<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>polestarpos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="../../static/css/w-layout.css" th:href="@{/css/w-layout.css}" rel="stylesheet" />
    <link href="../../static/css/start.css" th:href="@{/css/start.css}" rel="stylesheet" />
    <link href="../../static/css/account.css" th:href="@{/css/account.css}" rel="stylesheet" />
    <link href="../../static/css/modal.css" th:href="@{/css/modal.css}" rel="stylesheet" />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body>
    <!-- ヘッダー部 -->
    <header class="header-content">
        <div class="header-btn">
            <h3><a href="">＜戻る</a></h3>
        </div>
        <div class="header-item">
            <p>ログイン：店長</p>
        </div>
        <div class="system-title">
            <a href="/w/home.html" th:href="@{/w/home}">
                <h2><span class="orbitron">Pole<span style="color: #ffd736;">star</span></span> POS SYSTEM</h2>
            </a>
        </div>
        <div class="header-item d-flex justify-content-end">
            <button class="edit-btn">
                <a href="" style="color: #0047A3; text-decoration: none;">編集</a>
            </button>
        </div>
        <div class="header-btn">
            <h5 id="date"></h5>
            <h5 class="clock"></h5>
        </div>
    </header>

    <!-- メインコンテンツ部 -->
    <main class="main-content">

            <!-- =====================================================
                Thymeleaf連携用スロット
                値を受け取る側で th:text を差し替えてください。
                例: th:text="${thymeleafUserId}"
                ===================================================== -->
            <div id="timereef-context" class="d-none" aria-hidden="true">
                <span id="timereef-user-id" th:text="${''}"></span>
                <span id="timereef-staff-id" th:text="${''}"></span>
                <span id="timereef-store-id" th:text="${''}"></span>
                <span id="timereef-shift-id" th:text="${''}"></span>
            </div>
        <div class="row">
            <!-- 商品選択ブロックエリア -->
            <div class="selector-area action-group-3 col-5">
                <!-- 商品ボタンエリア（FlexboxやGridで自動折り返し配置） -->
                <div class="row selectbutton flex-wrap">
                    <!-- DBから取得した menuList を繰り返し描画 -->
                    <button type="button" 
                            class="col-4 selecter-Button-item product-button" 
                            data-bs-toggle="modal" 
                            data-bs-target="#posModal1" 
                            th:each="item : ${menuList}"
                            th:data-product-id="${item?.goodsId}"
                            th:data-product-name="${item?.goodsName}"
                            th:data-product-price="${item?.price}"
                            style="cursor: pointer;">
                        
                        <!-- 商品名 -->
                        <p th:text="${item?.goodsName}">商品名</p>
                        
                        <!-- 価格 -->
                        <p th:text="${#numbers.formatInteger(item?.price, 1, 'COMMA') + '円'}">0円</p>
                        
                        <!-- カート内のバッジ表示（JS連動用） -->
                        <span class="quantity-badge d-none" th:attr="data-product-count=${item?.goodsId}">0</span>
                    </button>
                </div>
                <div class="" style="display: flex; justify-content: space-around; align-items: center; margin-top: 40px;">
                    <!-- ページネーションエリア -->
                    <div class="d-flex justify-content-center align-items-center" th:if="${response?.totalPages > 0}">
                        
                        <!-- 前へ (<) ボタン -->
                        <a th:href="@{/w/account/staff(page=${currentPage - 1})}" 
                        class="pagination-arrow" 
                        th:classappend="${currentPage == 0} ? 'disabled'">&lt;</a>

                        <!-- ページ番号ボタン（1, 2, 3...） -->
                        <th:block th:each="i : ${#numbers.sequence(0, response?.totalPages - 1)}">
                            <a th:href="@{/w/account/staff(page=${i})}" 
                            class="pagination-num" 
                            th:classappend="${i == currentPage} ? 'btn-secondary active' : 'btn-outline-secondary'"
                            th:text="${i + 1}">1</a>
                        </th:block>

                        <!-- 次へ (>) ボタン -->
                        <a th:href="@{/w/account/staff(page=${currentPage + 1})}" 
                        class="pagination-arrow" 
                        th:classappend="${currentPage + 1 == response?.totalPages} ? 'disabled'">&gt;</a>
                    </div>
                    <button type="button" class="edit-btn yellow-btn" style="margin-left: 20px;" id="qr-open-btn"
                            data-bs-toggle="modal" data-bs-target="#qrModal">
                        <span style="color: #0047A3; text-decoration: none;">QR</span>
                    </button>
                    <div class="qr-member-display">
                        QR ID: <span id="qr-member-id" class="qr-id-value">未読み取り</span>
                    </div>
                </div>
            </div>
            
            <!-- アクション3小計用画面切り替え -->
            <div class="selector-area action-group-4 d-none col-5">
                <div class="pay-disp position-relative">
                    <div class="pay-amount">
                        <h3>小計</h3>
                        <h1 id="subtotal-display">660</h1>
                        <h3>円</h3>
                    </div>
                </div>
                <div class="row selectbutton">
                    <button type="button"
                            class="col selecter-Button-item discount-button"
                            data-discount="-50">
                        <p>割引 学生</p>
                        <p>-50円</p>
                    </button>
                    <button type="button"
                            class="col selecter-Button-item discount-button"
                            data-discount="-100">
                        <p>スタンプカード割引</p>
                        <p>-100円</p>
                    </button>
                    <button type="button"
                            class="col selecter-Button-item discount-button"
                            data-discount="-100">
                        <p>スタンプカード唐揚げ1無料</p>
                        <p>-100円</p>
                    </button>
                </div>
                <div class="row selectbutton">
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                </div>
                <div class="row selectbutton">
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                </div>
                <div class="row selectbutton">
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                </div>
                <div class="row selectbutton">
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                    <button class="col selecter-Button-item">
                    </button>
                </div>
                <button class="edit-btn" id="back-to-subtotal" style="cursor: pointer;">
                    <p style="color: #0047A3; text-decoration: none;" >戻る</p>
                </button>
            </div>

            <!-- 計算エリア -->
            <div class="clac-area col-7">
                <div>
                    <div class="pay-disp action-group-3">
                        <button class="edit-btn">
                            <a href="" style="color: #0047A3; text-decoration: none;" 
                                data-bs-toggle="modal" 
                                data-bs-target="#posModal3"
                            >詳細</a>
                        </button>
                        <div class="pay-amount">
                            <h3>合計</h3>
                            <h1 id="total-display">0</h1>
                            <h3>円</h3>
                            <div class="calculator-input-preview">
                                電卓入力：<strong id="calculator-input-display">0</strong>
                            </div>
                            <div class="mobile-order-label" id="mobile-order-display">通常会計</div>
                            <div class="return-status" id="return-status"></div>
                        </div>
                    </div>

                    <!-- アクション3小計操作 -->
                    <div class="pay-disp action-group-4 d-none">
                        <div class="pay-amount">
                            <h3 id="received-label">預かり</h3>
                            <h1 id="received-display">0</h1>
                            <h3>円</h3>
                            <div class="mobile-order-label" id="mobile-order-display-action4"></div>
                        </div>
                    </div>
                    
                    <hr class="my-4">

                    <!-- 電卓・操作ボタンエリア -->
                    <div class="clac-button">
                        <!-- 1行目: アクションボタン上部 -->
                        <div class="row">
                            <button type="button" class="col selecter-Button-narrow blue-btn" id="calculator-clear">
                                <p>C</p>
                            </button>
                            <!-- アクション1のボタン群 -->
                            <button type="button" class="col selecter-Button-narrow blue-btn action-group-1" id="cancel-last-item-btn">
                                <p>取消</p>
                            </button>
                            <button type="button" class="col selecter-Button-narrow yellow-btn action-group-1" id="ten-thousand-btn">
                                <p>万券</p>
                            </button>
                            <!-- アクション2のボタン群（初期は非表示） -->
                            <button type="button" class="col selecter-Button-narrow red-btn action-group-2 d-none" id="return-last-item-btn">
                                <p>返品</p>
                            </button>
                            <button type="button" class="col selecter-Button-narrow pink-btn action-group-2 d-none" id="manual-discount-btn">
                                <p>値引</p>
                            </button>
                        </div>

                        <!-- 2行目: テンキー (7, 8, 9) -->
                        <div class="row">
                            <button class="col selecter-Button" data-calc-num="7"><p>7</p></button>
                            <button class="col selecter-Button" data-calc-num="8"><p>8</p></button>
                            <button class="col selecter-Button" data-calc-num="9"><p>9</p></button>
                        </div>

                        <!-- 3行目: テンキー (4, 5, 6) -->
                        <div class="row">
                            <button class="col selecter-Button" data-calc-num="4"><p>4</p></button>
                            <button class="col selecter-Button" data-calc-num="5"><p>5</p></button>
                            <button class="col selecter-Button" data-calc-num="6"><p>6</p></button>
                        </div>

                        <!-- 4行目: テンキー (1, 2, 3) -->
                        <div class="row">
                            <button class="col selecter-Button" data-calc-num="1"><p>1</p></button>
                            <button class="col selecter-Button" data-calc-num="2"><p>2</p></button>
                            <button class="col selecter-Button" data-calc-num="3"><p>3</p></button>
                        </div>

                        <!-- 5行目: テンキー (0, 00, M/取消) -->
                        <div class="row">
                            <button class="col selecter-Button" data-calc-num="0"><p>0</p></button>
                            <button class="col selecter-Button" data-calc-num="00"><p>00</p></button>
                            <button type="button" class="col selecter-Button green-btn action-group-1" id="calculator-memory"><p>M</p></button>
                            <button type="button" class="col selecter-Button blue-btn action-group-2 d-none" id="cancel-all-btn"><p>取消</p></button>
                        </div>

                        <!-- 6行目: アクション切り替え ＆ 決定行 -->
                        <div class="row">
                            <!-- 切替実行ボタン -->
                            <button class="selecter-Button-square" id="toggle-action-btn" style="cursor: pointer;">
                                <p>切替</p>
                            </button>
                            <button type="button" class="selecter-Button-square" id="calculator-backspace">
                                <p>×</p>
                            </button>
                            
                            <!-- アクション1決定 -->
                            <button type="button" class="col selecter-Button-narrow yellow-btn action-group-1" id="confirm-manual-btn">
                                <p>決定</p>
                            </button>

                            <!-- アクション2拡張ボタン -->
                            <button type="button" class="selecter-Button-square yellow-btn action-group-2 d-none" id="exchange-btn">
                                <p>両替</p>
                            </button>
                            <button type="button" class="selecter-Button-square action-group-2 d-none" id="receipt-btn">
                                <p>領収書</p>
                            </button>

                            <button class="col selecter-Button-narrow orange-btn action-group-3" id="toggle-action-pay">
                                <p>小計</p>
                            </button>

                            <!-- アクション3小計 -->
                            <button type="button"
                                    class="col selecter-Button-narrow orange-btn action-group-4 d-none"
                                    id="complete-payment-btn">
                                <p>預/現計</p>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- 商品詳細モーダル -->
        <div id="posModal1" class="modal modal-window">
            <div class="modal-dialog">
                <div class="modal-content">
                    <h2 class="modal-title">商品詳細</h2>
                    <div class="modal-body">
                        <div class="modal-productname row">
                            <h2 class="col" id="modal-product-name" th:text="${product?.name}">商品を選択してください</h2>
                            <hr class="my-1">
                            <h4 class="col" id="modal-product-description" th:text="${product?.description}">商品内容</h4>
                        </div>
                        <div class="modal-select col-5">
                            <div class="row selectbutton">
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T001" data-topping-name="ごはん小盛り" data-topping-price="-50">
                                    <p>ごはん小盛り</p>
                                    <p>-50円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T001">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T002" data-topping-name="ごはん普通" data-topping-price="0">
                                    <p>ごはん普通</p>
                                    <p>0円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T002">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T003" data-topping-name="ごはん大盛り" data-topping-price="50">
                                        <p>ごはん大盛り</p>
                                        <p>+50円</p>
                                        <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T003">0</span>
                                    </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T004" data-topping-name="ごはん特盛" data-topping-price="100">
                                    <p>ごはん特盛</p>
                                    <p>+100円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T004">0</span>
                                </button>
                                <button class="col selecter-Button-modal">
                                    <p></p>
                                    <p></p>
                                </button>
                            </div>
                            <div class="row selectbutton">
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T005" data-topping-name="おろしポン酢" data-topping-price="50">
                                    <p>おろしポン酢</p>
                                    <p>+50円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T005">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T006" data-topping-name="自家製タルタル" data-topping-price="80">
                                    <p>自家製タルタル</p>
                                    <p>+80円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T006">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T007" data-topping-name="油淋鶏風ネギダレ" data-topping-price="80">
                                    <p>油淋鶏風ネギダレ</p>
                                    <p>+80円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T007">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T008" data-topping-name="旨辣麻婆ソース" data-topping-price="100">
                                    <p>旨辣麻婆ソース</p>
                                    <p>+100円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T008">0</span>
                                </button>
                                <button class="col selecter-Button-modal">
                                    <p></p>
                                    <p></p>
                                </button>
                            </div>
                            <div class="row selectbutton">
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T009" data-topping-name="追加ザンギ" data-topping-price="100">
                                    <p>追加ザンギ</p>
                                    <p>+100円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T009">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T010" data-topping-name="満腹ザンギセット（味噌汁＋ポテトサラダ）" data-topping-price="200">
                                    <p>満腹ザンギセット（味噌汁＋ポテトサラダ）</p>
                                    <p>+200円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T010">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T011" data-topping-name="満腹ザンギセット（味噌汁＋大根サラダ）" data-topping-price="200">
                                    <p>満腹ザンギセット（味噌汁＋大根サラダ）</p>
                                    <p>+200円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T010">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T012" data-topping-name="満腹ザンギセット（味噌汁＋マカロニたまごサラダ）" data-topping-price="200">
                                    <p>満腹ザンギセット（味噌汁＋マカロニたまごサラダ）</p>
                                    <p>+200円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T012">0</span>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-nomal topping-button" data-topping-id="T013" data-topping-name="定番コンビセット（味噌汁＋緑茶）" data-topping-price="200">
                                    <p>定番コンビセット（味噌汁＋緑茶）</p>
                                    <p>+200円</p>
                                    <span class="quantity-badge quantity-badge-small d-none" data-topping-count="T013">0</span>
                                </button>
                            </div>
                            <div class="row selectbutton">
                                <div class="col-5 pay-disp">
                                    <div class="pay-amount">
                                        <h3>合計</h3>
                                        <h1></h1>
                                        <h1 id="modal-item-total">0</h1>
                                        <h3>円</h3>
                                    </div>
                                </div>
                                <button type="button" class="col selecter-Button-modal modal-warning" id="stop-sale-btn">
                                    <h3>販売停止</h3>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-add" id="add-product-btn">
                                    <h3>追加する</h3>
                                </button>
                                <button type="button" class="col selecter-Button-modal modal-close" data-bs-dismiss="modal" style="cursor: pointer;">
                                    <h3>閉じる</h3>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        
        <!-- 登録詳細モーダル -->
        <div id="posModal3" class="modal modal-window">
            <div class="modal-dialog">
                <div class="modal-content">
                    <h2 class="modal-title">登録詳細</h2>
                    <div class="modal-body">
                        <table class="table table-hover align-middle custom-table">
                            <thead>
                                <tr>
                                    <th scope="col">No</th>
                                    <th scope="col">商品名</th>
                                    <th scope="col">数量</th>
                                    <th scope="col">単価</th>
                                    <th scope="col">割引額</th>
                                    <th scope="col">合計</th>
                                    <th scope="col"></th> <!-- ボタン用 -->
                                </tr>
                            </thead>
                            <!-- tbody 内を空にしてJavaScriptによる動的描画に任せる -->
                            <tbody id="modal-cart-tbody">
                                <tr>
                                    <td colspan="7" class="cart-empty text-center">商品が登録されていません</td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="row selectbutton">
                            <div class="col-5 pay-disp">
                                <div class="pay-amount">
                                    <h3>合計</h3>
                                    <h1></h1>
                                    <h1>660</h1>
                                    <h3>円</h3>
                                </div>
                            </div>
                            <div class="col-2"></div>
                            <div class="col-3"></div>
                            <button type="button" class="col selecter-Button-modal modal-close" data-bs-dismiss="modal" style="cursor: pointer;">
                                <h3>閉じる</h3>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- QRコード読み取りモーダル: 読み取り結果はJavaへの会計POSTにqrIdとして含めます。 -->
        <div id="qrModal" class="modal modal-window" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <h2 class="modal-title">QRコード読み取り</h2>
