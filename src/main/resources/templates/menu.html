<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
    <link href="../static/css/settings.css" th:href="@{/css/settings.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
	<div th:replace="~{common/Layout :: common-header}"></div>

    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <div class="upper-item">
                <h2 style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">メニュー一覧</h2>
                <button class="img-button" type="button" data-bs-toggle="modal" data-bs-target="#aiModal">
                    <img class="userEditBtn" src="../static/img/AI提案ボタン.png" th:src="@{/img/AI提案ボタン.png}" alt="AI提案">
                </button>
            </div>
        
            <!-- メニューデータが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(menuList)}">
                <h5 class="item-block-text">メニューが存在しません。</h5>
            </div>

            <!-- メニューデータが存在する場合（th:eachでループ） -->
            <div class="item-block menu-item"
                th:each="item : ${menuList}"
                th:onclick="|location.href='@{/menu/add(goodsId=${item.goodsId})}'|"
                style="cursor: pointer;">
                    <div class="name-block" style="min-width: 0;" > <!-- min-width: 0 でflex要素内の ellipsis 崩れを防止 -->
                        <!-- 商品名（はみ出したら...で切り取り） -->
                        <h3 class="text-truncate" th:text="${item.goodsName}">元祖ザンギ弁当（3個）</h3>
                        
                        <!-- 金額 -->
                        <h5 class="text-secondary" th:text="${#numbers.formatInteger(item.price, 1, 'COMMA') + '円'}">780円</h5>                
                    </div>

                    <!-- 商品画像 -->
                    <img src="../static/img/ザンギ弁当.jpg" th:src="@{${item.photo}}" alt="商品画像">
            </div>
        </div>
    </main>

    <!-- ソート用カテゴリ（th:eachで動的取得） -->
    <div class="foot-menu">
        <div class="foot-menu-select">
            <!-- 「すべて」タブ -->
            <a href="/menu" th:href="@{/menu}" 
                class="foot-menu-select-button text-decoration-none"  
                th:classappend="${selectedCategoryId == null} ? '' : 'text-secondary'"
            >すべて</a>

            <!-- 各カテゴリタブ（th:eachでループ表示） -->
            <a href="#" th:href="@{/menu(categoryId=${category.id})}" 
                class="foot-menu-select-button text-decoration-none" 
                th:each="category : ${categoryList}" 
                th:classappend="${selectedCategoryId == category.id} ? '' : 'text-secondary'"
                th:text="${category.name}">ザンギ弁当</a>
        </div>
    </div>

    <!-- AIモーダル -->
    <!-- AI提案モーダル -->
    <div class="modal fade" id="aiModal" tabindex="-1" aria-labelledby="aiModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <!-- モーダルヘッダー -->
                <div class="modal-header bg-ai-green">
                    <h5 class="modal-title font-weight-bold" id="aiModalLabel">
                        AIメニュー相談
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- モーダル本体 -->
                <div class="modal-body">
                    <!-- AIレスポンス表示エリア（チャット風） -->
                    <div id="aiResponseArea" class="p-3 mb-3 bg-light rounded" style="min-height: 120px; max-height: 250px; overflow-y: auto;">
                        <p th:if="${aiAnswer == null}" class="text-muted small mb-0">
                            ご相談内容をご入力ください！
                        </p>

                        <div th:if="${aiAnswer != null}">
                            <!-- ユーザーの質問 -->
                            <div class="text-end mb-2">
                                <span class="d-inline-block bg-primary text-white p-2 rounded-3 text-start small" th:text="${userPrompt}">
                                    ユーザーの質問
                                </span>
                            </div>
                            <!-- AIの回答 -->
                            <div class="text-start mb-2">
                                <span class="d-inline-block bg-white p-2 rounded-3 border text-dark small" th:utext="${#strings.replace(aiAnswer, '&#10;', '&lt;br&gt;')}">
                                    AIの回答文章
                                </span>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/menu/ai}" method="post" onsubmit="showLoading()">
                        
                        <!-- ローディング表示エリア -->
                        <div id="aiLoading" class="text-center my-3 d-none">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2 text-muted fw-bold small">おすすめを考えています...</p>
                        </div>

                        <!-- 入力フォームエリア -->
                        <div class="input-group">
                            <textarea name="userPrompt" class="form-control" rows="2" placeholder="例: ダイエット中でカロリー控えめなメニューはある？" required></textarea>
                            
                            <!-- 送信ボタンに id="sendAiBtn" を設定 -->
                            <button id="sendAiBtn" class="btn btn-ai-green fw-bold" type="submit">
                                <span id="btnText">送信 <i class="bi bi-send-fill ms-1"></i></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- フッダー部 -->
	<div th:replace="~{common/Layout :: common-footer}"></div>

    <!-- AI JS -->
        <script>
        function showLoading() {
            // 作成中表示を表示
            var loadingEl = document.getElementById('aiLoading');
            if (loadingEl) {
                loadingEl.classList.remove('d-none');
            }

            //  二重送信を防ぐためボタンを無効化 テキストを変更
            var btn = document.getElementById('sendAiBtn');
            if (btn) {
                btn.disabled = true;
                document.getElementById('btnText').innerText = '作成中';
            }
        }
    </script>

    <!-- 画面更新後にモーダルを開く -->
    <script th:if="${aiAnswer != null}">
        document.addEventListener('DOMContentLoaded', function() {
            var aiModal = new bootstrap.Modal(document.getElementById('aiModal'));
            aiModal.show();
        });
    </script>
</body>

</html>
