<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../../static/css/settings.css" th:href="@{/css/settings.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn">

        </div>
        <div class="system-title">
            <a href=""><h2>ORDER ZANGI</h2></a>
        </div>
        <div class="header-stampcard header-btn">
            <a href=""><img style="width: 65px; height: auto;" src="../../static/img/スタンプカード.png" alt="スタンプカード"></a>
        </div>
    </header>

    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <div class="profile">
                <h2>マイページ</h2>
                <div class="container my-5" style="max-width: 900px;">
                    <div>
                        <form action="/update-profile" method="POST" enctype="multipart/form-data">
                            <div class="row g-4">
                                
                                <!-- プロフィール画像エリア（上部中央寄せ） -->
                                <div class="col-12 text-center">
                                    <!-- 画像プレビュー -->
                                    <div class="mb-3 d-flex justify-content-center">
                                        <img src="../../static/img/sibainu1.jpg" id="avatarPreview" class="rounded-circle img-thumbnail shadow-sm" style="width: 150px; height: 150px; object-fit: cover;" alt="プロフィール画像">
                                    </div>
                                    
                                    <!-- 画像アップロード -->
                                    <div class="col-md-6 mx-auto mb-3">
                                        <input class="form-control form-control-sm" type="file" id="referenceBtn" name="referenceBtn" accept="image/*">
                                        <div class="form-text">JPG, PNG（最大5MB）</div>
                                    </div>
                                </div>

                                <!-- フォーム入力エリア -->
                                <div class="col-12">
                                
                                    <!-- ユーザー名 -->
                                    <div class="mb-3">
                                        <label for="name" class="form-label fw-bold">ユーザー名</label>
                                        <input type="text" class="form-control" id="name" name="name" value="ユーザ名" placeholder="ユーザ名" required>
                                    </div>

                                    <!-- メールアドレス -->
                                    <div class="mb-3">
                                        <label for="mailAddress" class="form-label fw-bold">メールアドレス</label>
                                        <input type="email" class="form-control" id="mailAddress" name="mailAddress" value="zangui@ben.com" placeholder="user@example.com" required>
                                    </div>

                                    <!-- パスワード変更エリア -->
                                    <h5 class="mb-3 fw-bold fs-6">パスワード</h5>

                                    <!-- 古いパスワード ＆ 新しいパスワード -->
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" placeholder="現在のパスワードを入力">
                                        </div>

                                        <div class="col-md-6">
                                            <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="新しいパスワードを入力">
                                        </div>
                                    </div>
                                    
                                    <!-- 新しいパスワード確認 -->
                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <input type="password" class="form-control" id="newPasswordConf" name="newPasswordConf" placeholder="新しいパスワードを再入力">
                                        </div>
                                    </div>

                                    <!-- ボタンエリア（設定を保存 / 破棄して戻る） -->
                                    <div class="d-flex justify-content-end gap-2 pt-2">
                                        <a href="/dashboard" id="discardChanges" class="btn btn-outline-secondary px-4">破棄して戻る</a>
                                        <button id="changesConfirmedBtn" type="submit" class="btn btn-warning px-4">設定を保存</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div class="footer-btn">
            <a href=""><img style="width: 36px; height: 53px;" src="../../static/img/ホームボタン.png" alt="ホーム"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 48px; height: 53px;"  src="../../static/img/メニューボタン.png" alt="メニュー"></a>
        </div>
        <div class="footer-btn" style="position: relative; top: -20px;">
            <a href=""><img style="width: 77px; height: 96px;" src="../../static/img/予約ボタン.png" alt="予約"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 33px; height: 51px;" src="../../static/img/履歴ボタン.png" alt="履歴"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 60px; height: 51px;" src="../../static/img/マイページボタン.png" alt="マイページ"></a>
        </div>
    </footer>
    <script src="../static/js/settings.js"></script>
</body>

</html>
