<!-- 顧客用 -->
<header class="header-content" th:fragment="common-header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <!-- 左エリア：スタンプカード -->
    <div class="header-left-group">
        <div class="header-btn" sec:authorize="hasAnyAuthority('店長', 'ROLE_店長', '店員', 'ROLE_店員')">
            <h3><a href="/w/home.html" th:href="@{/w/home}" style="font-size: 20px; color: #555; text-decoration: none; font-weight: bold;">＜戻る</a></h3>
        </div>
        <div class="header-item" sec:authorize="hasAnyAuthority('店長', 'ROLE_店長', '店員', 'ROLE_店員')">
            <p sec:authorize="hasAnyAuthority('店長', 'ROLE_店長')" style="margin: 0;">ログイン：店長</p>
            <p sec:authorize="hasAnyAuthority('店員', 'ROLE_店員')" style="margin: 0;">ログイン：店員</p>
        </div>
        <div class="header-btn header-stampcard" sec:authorize="!hasAnyAuthority('店長', 'ROLE_店長', '店員', 'ROLE_店員')">
            <a href="/stampcard" th:href="@{/stampcard}" sec:authorize="hasAnyAuthority('顧客', 'ROLE_顧客') or isAnonymous()">
                <img style="width: 65px; height: auto;" src="../static/img/スタンプカード.png" th:src="@{/img/スタンプカード.png}" alt="スタンプカード">
            </a>
        </div>
    </div>
    <!-- 中央エリア：システムタイトル -->
    <div class="header-center-group system-title noto-sans">
        <a href="/w/home.html" th:href="@{/w/home}" sec:authorize="hasAnyAuthority('店長', 'ROLE_店長', '店員', 'ROLE_店員')">
            <h2 style="margin: 0;">ORDER ZANGI</h2>
        </a>
        <a href="/" th:href="@{/}" sec:authorize="!hasAnyAuthority('店長', 'ROLE_店長', '店員', 'ROLE_店員')">
            <h2 style="margin: 0;">ORDER ZANGI</h2>
        </a>
    </div>
    <!-- 右エリア：ログアウトボタン -->
    <div class="header-right-group">
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="margin: 0;">
            <button type="submit" class="btn-logout">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                    <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                </svg>
                <span>ログアウト</span>
            </button>
        </form>
    </div>
</header>

<!-- 顧客（または未ログイン）のみフッターを表示 -->
<footer class="footer-content" th:fragment="common-footer" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" sec:authorize="hasAnyAuthority('顧客', 'ROLE_顧客') or isAnonymous()">
    <div class="footer-btn">
        <a href="home" th:href="@{/}"><img style="width: 36px; height: 53px;" src="../static/img/ホームボタン.png" th:src="@{/img/ホームボタン.png}" alt="ホーム"></a>
    </div>
    <div class="footer-btn">
        <a href="menu" th:href="@{/menu}"><img style="width: 48px; height: 53px;"  src="../static/img/メニューボタン.png" th:src="@{/img/メニューボタン.png}" alt="メニュー"></a>
    </div>
    <div class="footer-btn" style="position: relative; top: -20px;">
        <a href="cart" th:href="@{/menu/cart}"><img style="width: 77px; height: 96px;" src="../static/img/予約ボタン.png" th:src="@{/img/予約ボタン.png}" alt="予約"></a>
    </div>
    <div class="footer-btn">
        <a href="history" th:href="@{/history}"><img style="width: 33px; height: 51px;" src="../static/img/履歴ボタン.png" th:src="@{/img/履歴ボタン.png}" alt="履歴"></a>
    </div>
    <div class="footer-btn">
        <a href="settings" th:href="@{/settings}"><img style="width: 60px; height: 51px;" src="../static/img/マイページボタン.png" th:src="@{/img/マイページボタン.png}" alt="マイページ"></a>
    </div>
</footer>
