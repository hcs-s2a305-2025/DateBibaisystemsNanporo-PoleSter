<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音声読み上げテスト</title>
</head>
<body>
    <textarea id="text" rows="4" cols="40">お待たせいたしました。注文番号「M072」番のお客様、準備ができましたので、受け取り窓口までお越しください。</textarea>
    <br>
    <button onclick="speakText()">読み上げ</button>

    <script>
        function speakText() {
            const text = document.getElementById("text").value;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = "ja-JP"; // 言語設定
            window.speechSynthesis.speak(utter);
        }
    </script>
</body>
</html>
