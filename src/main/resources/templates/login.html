<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../static/css/start.css" th:href="@{/css/start.css}" rel="stylesheet" />
    <link href="../static/css/login.css" th:href="@{/css/login.css}" rel="stylesheet" />
</head>

<body>
    <!-- 全画面ロード（スプラッシュ）表示エリア -->
    <div id="splash-screen">
        <div></div>
        <div class="splash-center">
            <p>Powerd by</p>
            <h1 class="orbitron">Pole<span style="color: #ffd736;">star</span></h1>
        </div>
        <div class="splash-footer">
            <h2 class="saira">DBS</h2>
        </div>
    </div>

    <main>
        <div class="login-do">
            <img src="../static/img/karaage.png" th:src="@{/img/karaage.png}" alt="ORDER ZANGI" style="width: 70px;">
            <h2>ORDER ZANGI</h2>
            <h2>にログインする</h2>
        </div>
        <form class="login-input" th:action="@{/login}" method="POST">
            
            <div class="input-group mb-4 w-100">
                <input type="email" class="form-control" id="mail" name="mail" placeholder="メールアドレス" aria-label="メールアドレス" autocomplete="mail" required>
            </div>
            
            <div class="input-group mb-2 w-100">
                <input type="password" class="form-control" id="password" name="password" placeholder="パスワードを入力" aria-label="パスワード" autocomplete="current-password" required>
            </div>

            <div class="mb-5 w-100">
                <a id="rePasswordBtn" 
                    href="/repassword" 
                    th:href="@{/repassword}" 
                    class="link-primary position-relative d-inline-block text-decoration-underline" 
                    style="z-index: 999; cursor: pointer;">
                    パスワードを忘れた場合はこちら</a>
            </div>

            <div class="mb-5 w-100">
                <button id="loginBtn" type="submit" class="btn btn-primary w-100">ログイン</button>
            </div>

            <div class="text-center">
                <a id="signUpBtn" 
                    href="/signup" 
                    th:href="@{/signup}" 
                    class="link-primary position-relative d-inline-block text-decoration-underline" 
                    style="z-index: 999; cursor: pointer;">
                    アカウントを作成する場合はこちら</a>
            </div>
            
        </form>
        <h1 class="orbitron">Pole<span style="color: #ffd736;">star</span></h1>
    </main>

    <!-- 休業日メッセージ表示用 モーダル -->
    <div class="modal fade" id="closedModal" tabindex="-1" aria-labelledby="closedModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header text-dark" style="background-color: #ffd736a9;">
                    <h5 class="modal-title" id="closedModalLabel">システム休止のお知らせ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="fs-5 mb-0" th:text="${closedMessage}">本日は休業日のためシステムを休止しております。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- スプラッシュ画面消去処理 script -->
    <script th:inline="javascript">
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-screen');
            // 1.5秒（1500ms）後にフェードアウトを開始
            setTimeout(() => {
            if (splash) {
                splash.classList.add('fade-out');
                
                // アニメーション完了後（さらに0.5秒後）に要素自体を非表示にする
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }
        }, 1500);
    });

        function showClosedModal() {
        // スプラッシュ画面が消え終わったタイミング（2.0秒後）でモーダル表示
        setTimeout(() => {
            const modalEl = document.getElementById('closedModal');
            if (modalEl) {
                const closedModal = new bootstrap.Modal(modalEl);
                closedModal.show();
            }
        }, 2000);
    }
    </script>
    <script th:if="${closedMessage != null}">
        showClosedModal();
    </script>
</body>

</html>
