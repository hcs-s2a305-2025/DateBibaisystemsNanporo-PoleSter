<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn"></div>
        <div class="system-title">
            <a href="/" th:href="@{/}"><h2>ORDER ZANGI</h2></a>
        </div>
        <div class="header-stampcard header-btn">
            <a href="/stampcard" th:href="@{/stampcard}">
                <img style="width: 65px; height: auto;" src="../static/img/スタンプカード.png" th:src="@{/img/スタンプカード.png}" alt="スタンプカード">
            </a>
        </div>
    </header>
    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <!-- 予約中の商品 -->
            <h2>予約中の商品</h2>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(activeOrders)}">
                <h5 class="item-block-text">予約中の商品はありません。</h5>
            </div>

            <!-- 予約データが存在する場合 -->
            <div class="item-block" th:each="item : ${activeOrders}">
                <div class="item-block-info">
                    <p th:text="${'注文番号：' + item.order.orderNumber }">注文番号：M0001</p>
                    <p th:text="${'会計：' + #numbers.formatInteger(item.order.sumMoney, 1, 'COMMA') + '円'}">会計：780円</p>
                    <p th:text="${'受け取り予定：' + #dates.format(item.order.getTime, 'yyyy/MM/dd HH:mm')}">受け取り予定：12:30</p>
                    <p th:text="${'ステータス：' + item.order.status}">ステータス：受付</p>
                </div>
                <h3 th:text="${'注文商品：' + item.goodsNames}">注文商品：元祖ザンギ弁当（5個）</h3>
                <img class="expansion-btn" src="../static/img/拡大ボタン.png" th:src="@{/img/拡大ボタン.png}" alt="拡大" style="width: 50px; height: auto;">
            </div>

            <!-- お店からの通知一覧 -->
            <h2>通知</h2>

            <!-- 通知データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(notificationList)}">
                <p class="item-block-text">新しい通知はありません。</p>
            </div>

            <!-- 通知データが存在する場合 -->
            <div class="item-block" th:each="notice : ${notificationList}" th:unless="${#lists.isEmpty(notificationList)}">
                <h3 th:text="${notice.title}">通知タイトル</h3>
                <p class="item-block-text" th:text="${notice.content}">通知の内容がここに入ります。</p>
                <img class="expansion-btn" src="../static/img/拡大ボタン.png" th:src="@{/img/拡大ボタン.png}" alt="拡大" style="width: 50px; height: auto;">
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div class="footer-btn">
            <a href="home"><img style="width: 36px; height: 53px;" src="../static/img/ホームボタン.png" th:src="@{/img/ホームボタン.png}" alt="ホーム"></a>
        </div>
        <div class="footer-btn">
            <a href="menu"><img style="width: 48px; height: 53px;"  src="../static/img/メニューボタン.png" th:src="@{/img/メニューボタン.png}" alt="メニュー"></a>
        </div>
        <div class="footer-btn" style="position: relative; top: -20px;">
            <a href="reserve"><img style="width: 77px; height: 96px;" src="../static/img/予約ボタン.png" th:src="@{/img/予約ボタン.png}" alt="予約"></a>
        </div>
        <div class="footer-btn">
            <a href="history"><img style="width: 33px; height: 51px;" src="../static/img/履歴ボタン.png" th:src="@{/img/履歴ボタン.png}" alt="履歴"></a>
        </div>
        <div class="footer-btn">
            <a href="settings"><img style="width: 60px; height: 51px;" src="../static/img/マイページボタン.png" th:src="@{/img/マイページボタン.png}" alt="マイページ"></a>
        </div>
    </footer>
</body>

</html>
