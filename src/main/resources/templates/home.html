<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn">

        </div>
        <div class="system-title">
            <h2>ORDER ZANGI</h2>
        </div>
        <div class="header-stampcard header-btn">
            <img src="../static/img/スタンプカード.png" alt="スタンプカード">
        </div>
    </header>

    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <h2 class="col-12">予約中の商品</h2>
            <p class="item-block">予約中の商品はありません。</p>
            <h2>通知</h2>
            <div class="item-block">
                <h3>通知1</h3>
                <p>詳細欄</p>
            </div>
            <div class="item-block">
                <h3>通知2</h3>
                <p>詳細欄</p>
            </div>
            <div class="item-block">
                <h3>通知3</h3>
                <p>詳細欄</p>
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div>
            <img src="../static/img/ホームボタン.png" alt="ホーム">
        </div>
        <div>
            <img src="../static/img/メニューボタン.png" alt="メニュー">
        </div>
        <div  style="position: relative; top: -20px;">
            <img src="../static/img/予約ボタン.png" alt="予約">
        </div>
        <div>
            <img src="../static/img/履歴ボタン.png" alt="履歴">
        </div>
        <div>
            <img src="../static/img/マイページボタン.png" alt="マイページ">
        </div>
        
    </footer>
</body>

</html>
