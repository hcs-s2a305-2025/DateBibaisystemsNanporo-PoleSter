<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
	<div th:replace="~{common/Layout :: common-header}"></div>

    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <!-- 予約中の商品 -->
            <h2>予約中の商品</h2>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(activeOrders)}">
                <h5 class="item-block-text">予約中の商品はありません。</h5>
            </div>

            <!-- 予約データが存在する場合 -->
            <div class="item-block" th:each="item : ${activeOrders}"
                    style="cursor: pointer;"
                    data-bs-toggle="modal" 
                    th:data-bs-target="${'#orderModal-' + item.order.orderId}">
                <div class="item-block-info">
                    <p th:text="${'注文番号：' + item.order.orderNumber }">注文番号：M0001</p>
                    <p th:text="${'会計：' + #numbers.formatInteger(item.order.sumMoney, 1, 'COMMA') + '円'}">会計：780円</p>
                    <p th:text="${'受け取り予定：' + #dates.format(item.order.getTime, 'yyyy/MM/dd HH:mm')}">受け取り予定：12:30</p>
                    <p th:text="${'ステータス：' + item.order.status}">ステータス：受付</p>
                </div>
                <h3 th:text="${'注文商品：' + item.goodsNames}">注文商品：元祖ザンギ弁当（5個）</h3>
                <img class="expansion-btn" src="../static/img/拡大ボタン.png" th:src="@{/img/拡大ボタン.png}" alt="拡大" style="width: 50px; height: auto;">

            <!-- 注文詳細モーダル -->
                <div class="modal fade text-start" th:id="${'orderModal-' + item.order.orderId}" tabindex="-1" aria-hidden="true" onclick="event.stopPropagation();">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" th:text="${'注文詳細 (番号: ' + item.order.orderNumber + ')'}">注文詳細</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <strong>ステータス：</strong>
                                    <span class="badge bg-primary fs-6" th:text="${item.order.status}">受付</span>
                                </div>
                                <div class="mb-3">
                                    <strong>受け取り予定日時：</strong>
                                    <p class="mb-0 fs-5 fw-bold text-dark" th:text="${#dates.format(item.order.getTime, 'yyyy/MM/dd HH:mm')}">2026/09/24 13:10</p>
                                </div>
                                <div class="mb-3">
                                    <strong>注文商品：</strong>
                                    <p class="mb-0" th:text="${item.goodsNames}">名物！ザンギ弁当（3個入り）</p>
                                </div>
                                <div class="mb-3" th:if="${item.order.memo != null and !#strings.isEmpty(item.order.memo)}">
                                    <strong>備考・要望：</strong>
                                    <p class="mb-0" th:text="${item.order.memo}">特になし</p>
                                </div>
                                <hr />
                                <div class="text-end fs-5 fw-bold text-danger">
                                    合計金額：<span th:text="${#numbers.formatInteger(item.order.sumMoney, 1, 'COMMA') + '円'}">1,300円</span>
                                </div>
                            </div>
                            <div class="modal-footer d-flex justify-content-between">
                                <!-- 取り消しボタン（確認アラート表示後にPOST送信） -->
                                <form th:action="@{/order/cancel}" method="post" onsubmit="return confirm('この注文を取り消しますか？\n取り消した注文は元に戻せません。');" class="m-0">
                                    <input type="hidden" name="orderId" th:value="${item.order.orderId}" />
                                    <button type="submit" class="btn btn-outline-danger">注文を取り消す</button>
                                </form>

                                <div>
                                    <!-- 変更ボタン（カート編集画面へ遷移） -->
                                    <a th:href="@{/order/edit(orderId=${item.order.orderId})}" class="btn btn-warning me-2">注文を変更する</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- お店からの通知一覧 -->
            <h2>通知</h2>

            <!-- 通知データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(notificationList)}">
                <p class="item-block-text">新しい通知はありません。</p>
            </div>

            <!-- 通知データが存在する場合 -->
            <div class="item-block" th:each="notice : ${notificationList}" th:unless="${#lists.isEmpty(notificationList)}">
                <h3>通知</h3>
                <p class="item-block-text" th:text="${notice.content}">通知の内容がここに入ります。</p>
                <img class="expansion-btn" src="../static/img/拡大ボタン.png" th:src="@{/img/拡大ボタン.png}" alt="拡大" style="width: 50px; height: auto;">
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
	<div th:replace="~{common/Layout :: common-footer}"></div>

    <script>
    // 5秒ごとに画面を自動更新して最新のステータス・通知を取得
    setInterval(function() {
        location.reload();
    }, 5000);
    </script>
</body>

</html>
