<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../static/css/start.css" th:href="@{/css/start.css}" rel="stylesheet" />
    <link href="../static/css/login.css" th:href="@{/css/login.css}" rel="stylesheet" />
</head>

<body>
    <main>
        <div class="login-do">
            <img src="../static/img/karaage.png" alt="ORDER ZANGI" style="width: 70px;">
            <h2>ORDER ZANGI</h2>
            <h2>に登録する</h2>
        </div>
        <form class="login-input position-relative" style="z-index: 10;" th:action="@{/signup}" method="POST">
            
            <div class="input-group mb-4 w-100">
                <input type="email" class="form-control" id="mail" name="mail" placeholder="メールアドレス" aria-label="メールアドレス" autocomplete="email" required>
            </div>
            
            <div class="input-group mb-4 w-100">
                <input type="password" class="form-control" id="password" name="password" placeholder="パスワードを入力" aria-label="パスワード" autocomplete="new-password" required>
            </div>
            
            <div class="input-group mb-4 w-100">
                <input type="password" class="form-control" id="passwordagain" name="passwordConfirm" placeholder="パスワード確認用" aria-label="パスワード確認" autocomplete="new-password" required>
            </div>

            <div class="mb-4 w-100">
                <button id="createSignUpBtn" type="submit" class="btn btn-primary w-100">新規作成</button>
            </div>

            <!-- ログイン画面に戻るリンク -->
            <div class="text-center w-100">
                <a id="loginLink" href="/login" th:href="@{/login}" class="link-primary position-relative text-decoration-none" style="z-index: 999; cursor: pointer;">
                    すでにアカウントをお持ちの方はこちら
                </a>
            </div>
        </form>
        <h1 class="orbitron">Pole<span style="color: #ffd736;">star</span></h1>
        <!-- 性別・誕生日入力モーダル -->
        <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">プロフィール登録</h5>
                    </div>
                    <!-- 送信先を /signup/profile に指定 -->
                    <form th:action="@{/signup/profile}" method="post">
                        <div class="modal-body">
                            <!-- メールアドレス（hidden） -->
                            <input type="hidden" id="modalMail" name="mail">

                            <!-- 性別 -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">性別</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" id="genderMale" value="男" required>
                                        <label class="form-check-label" for="genderMale">男性</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="女" required>
                                        <label class="form-check-label" for="genderFemale">女性</label>
                                    </div>
                                </div>
                            </div>

                            <!-- 生年月日 -->
                            <div class="mb-3">
                                <label for="birthday" class="form-label fw-bold">生年月日</label>
                                <input type="date" class="form-control" id="birthday" name="birthday" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">登録してログインへ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // URLパラメータの取得
            const urlParams = new URLSearchParams(window.location.search);

            // 成功時の処理（モーダル起動）
            if (urlParams.has('success')) {
                const mail = urlParams.get('mail');
                if (mail) {
                    document.getElementById('modalMail').value = mail;
                }
                
                // Bootstrapモーダルを手動で初期化・表示
                const profileModalElement = document.getElementById('profileModal');
                const profileModal = new bootstrap.Modal(profileModalElement);
                profileModal.show();

                // URLパラメータを削除して綺麗にする
                history.replaceState(null, '', window.location.pathname);
                
            } else if (urlParams.has('mailNullError')) {
                alert('メールアドレスを入力してください。');
                history.replaceState(null, '', window.location.pathname);
            } else if (urlParams.has('passwordNullError')) {
                alert('パスワードを入力してください。');
                history.replaceState(null, '', window.location.pathname);
            } else if (urlParams.has('passwordError')) {
                alert('パスワードが一致しません。もう一度入力してください。');
                history.replaceState(null, '', window.location.pathname);
            } else if (urlParams.has('sameMailError')) {
                alert('すでに登録済みのアカウントです。');
                history.replaceState(null, '', window.location.pathname);
            } else if (urlParams.has('error')) {
                alert('ユーザの登録に失敗しました。もう一度お試しください。');
                history.replaceState(null, '', window.location.pathname);
            }

            // スケジュール切り替え処理
            const toggle = document.getElementById('toggleSchedule');
            if (toggle) {
                const controls = document.querySelectorAll('.schedule-control');
                const updateState = () => {
                    const isEnabled = toggle.checked;
                    controls.forEach(control => {
                        control.disabled = !isEnabled;
                    });
                };
                updateState();
                toggle.addEventListener('change', updateState);
            }
        });
    </script>
</body>

</html>
