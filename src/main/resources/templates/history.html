<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

	<div th:replace="~{common/Layout :: common-head}"></div>

<body>
	<!-- ヘッダー部 -->
	<div th:replace="~{common/Layout :: common-header}"></div>

    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <h2>予約した商品</h2>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(historyList)}">
                <h5 class="item-block-text">注文履歴はありません。</h5>
            </div>

            <!-- 予約データが存在する場合（注文ごとに繰り返し） -->
            <div class="item-block mb-4" th:each="order : ${historyList}">
                <!-- 注文日と注文番号 -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h3 class="m-0" th:text="${order.formattedDate}">2026年9月7日</h3>
                    <span class="badge bg-secondary" th:text="${'番号: ' + order.orderNumber}">M0001</span>
                </div>
                
                <!-- 注文内の商品リスト（商品ごとに繰り返し） -->
                <div th:each="item : ${order.items}" class="border-top pt-3 mt-2 d-flex justify-content-between align-items-center">
                    <!-- 左側：商品名・金額・トッピング情報 -->
                    <div class="pe-2" style="min-width: 0; flex: 1;">
                        <!-- 商品名と数量 -->
                        <h4 class="text-truncate mb-1" th:text="${item.goodsName + (item.count > 1 ? ' × ' + item.count : '')}">元祖ザンギ弁当（5個）</h4>
                        
                        <!-- 金額 -->
                        <h5 class="text-truncate mb-1" th:text="${#numbers.formatInteger(item.goodsPrice, 1, 'COMMA') + '円'}">780円</h5>
                        
                        <!-- トッピング・ソース情報 -->
                        <div th:if="${item.riceName != null && item.riceName != '普通 (250g)'}">
                            <p class="text-secondary mb-0 small" th:text="${'ご飯: ' + item.riceName + (item.ricePrice != 0 ? '(' + (item.ricePrice > 0 ? '+' : '') + item.ricePrice + '円)' : '')}">ご飯: 大盛り(+50円)</p>
                        </div>
                        <div th:if="${item.customName != null}">
                            <p class="text-secondary mb-0 small" th:text="${item.customName + (item.customPrice > 0 ? '(+' + item.customPrice + '円)' : '')}">タルタルソース(+80円)</p>
                        </div>
                        <div th:if="${item.zangiCount != null && item.zangiCount > 0}">
                            <p class="text-secondary mb-0 small" th:text="${'追加ザンギ: ' + item.zangiCount + '個(+' + (item.zangiCount * 100) + '円)'}">追加ザンギ: 2個(+200円)</p>
                        </div>
                        <div th:if="${item.setGoodsName != null && item.setGoodsName != ''}">
                            <p class="text-secondary mb-0 small" th:text="${'セット: ' + item.setGoodsName + (item.setGoodsPrice != null && item.setGoodsPrice > 0 ? '(+' + item.setGoodsPrice + '円)' : '')}">セット: 定番コンビセット(+200円)</p>
                        </div>
                    </div>
                    <!-- 右側：商品画像 -->
                    <img class="product-img" src="../static/img/ザンギ弁当.jpg" th:src="@{${item.Photo}}" alt="商品画像">
                </div>

                <hr class="my-3">

                <!-- 注文全体の合計金額と再注文ボタン -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="fw-bold">合計金額: </span>
                        <span class="fs-5 fw-bold text-danger" th:text="${#numbers.formatInteger(order.sumMoney, 1, 'COMMA') + '円'}">1,300円</span>
                    </div>

                    <!-- 再注文（カートに同じ注文を復元して再選択） -->
                    <a th:href="@{/order/reorder(orderId=${order.orderId})}" class="btn btn-warning px-3 text-white fw-bold" style="box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);">
                        もう一度注文する
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
	<div th:replace="~{common/Layout :: common-footer}"></div>
</body>

</html>
