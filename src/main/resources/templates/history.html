<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn"></div>
        <div class="system-title">
            <a href="/" th:href="@{/}"><h2>ORDER ZANGI</h2></a>
        </div>
        <div class="header-stampcard header-btn">
            <a href="/stampcard" th:href="@{/stampcard}">
                <img style="width: 65px; height: auto;" src="../static/img/スタンプカード.png" th:src="@{/img/スタンプカード.png}" alt="スタンプカード">
            </a>
        </div>
    </header>
    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <h2>予約した商品</h2>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(historyList)}">
                <h5 class="item-block-text">注文履歴はありません。</h5>
            </div>

            <!-- 予約データが存在する場合（注文ごとに繰り返し） -->
            <div class="item-block mb-4" th:each="order : ${historyList}">
                <!-- 注文日と注文番号 -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h3 class="m-0" th:text="${order.formattedDate}">2026年9月7日</h3>
                    <span class="badge bg-secondary" th:text="${'番号: ' + order.orderNumber}">M0001</span>
                </div>
                
                <!-- 注文内の商品リスト（商品ごとに繰り返し） -->
                <div th:each="item : ${order.items}" class="border-top pt-3 mt-2">
                    <!-- 商品名と数量 -->
                    <h4 th:text="${item.goodsName + (item.count > 1 ? ' × ' + item.count : '')}">元祖ザンギ弁当（5個）</h4>
                    
                    <!-- 金額 -->
                    <h5 th:text="${#numbers.formatInteger(item.goodsPrice, 1, 'COMMA') + '円'}">780円</h5>
                    
                    <!-- 商品画像 -->
                    <img class="product-img mb-2" src="../static/img/ザンギ弁当.jpg" th:src="@{'/' + ${item.Photo}}" alt="商品画像">
                    
                    <!-- トッピング・ソース情報 -->
                    <div th:if="${item.customName != null}">
                        <p class="text-secondary mb-1" th:text="${item.customName + '(+' + item.customPrice + '円)'}">タルタルソース(+80円)</p>
                    </div>
                </div>

                <hr class="my-3">

                <!-- 注文全体の合計金額と再注文ボタン -->
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="fw-bold">合計金額: </span>
                        <span class="fs-5 fw-bold text-danger" th:text="${#numbers.formatInteger(order.sumMoney, 1, 'COMMA') + '円'}">1,300円</span>
                    </div>

                    <!-- 再注文（カートに同じ注文を復元して再選択） -->
                    <a th:href="@{/order/reorder(orderId=${order.orderId})}" class="btn btn-warning px-3 text-white fw-bold" style="box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);">
                        もう一度注文する
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div class="footer-btn">
            <a href=""><img style="width: 36px; height: 53px;" src="../static/img/ホームボタン.png" alt="ホーム"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 48px; height: 53px;"  src="../static/img/メニューボタン.png" alt="メニュー"></a>
        </div>
        <div class="footer-btn" style="position: relative; top: -20px;">
            <a href=""><img style="width: 77px; height: 96px;" src="../static/img/予約ボタン.png" alt="予約"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 33px; height: 51px;" src="../static/img/履歴ボタン.png" alt="履歴"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 60px; height: 51px;" src="../static/img/マイページボタン.png" alt="マイページ"></a>
        </div>
    </footer>
</body>

</html>
