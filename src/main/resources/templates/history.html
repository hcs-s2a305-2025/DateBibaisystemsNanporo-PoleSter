<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Polestar | ORDER ZANGI</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<link href="../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet" />
    <link href="../static/css/menu.css" th:href="@{/css/menu.css}" rel="stylesheet" />
</head>

<body>
	<!-- ヘッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/header}"></div> -->
    <header class="header-content">
        <div class="header-btn"></div>
        <div class="system-title">
            <a href="/" th:href="@{/}"><h2>ORDER ZANGI</h2></a>
        </div>
        <div class="header-stampcard header-btn">
            <a href="/stampcard" th:href="@{/stampcard}">
                <img style="width: 65px; height: auto;" src="../static/img/スタンプカード.png" th:src="@{/img/スタンプカード.png}" alt="スタンプカード">
            </a>
        </div>
    </header>
    <!-- メインコンテンツ部 -->
    <main class="main-content">
        <div class="main-PC">
            <h2>予約した商品</h2>
            
            <!-- 予約データが存在しない場合 -->
            <div class="item-block" th:if="${#lists.isEmpty(historyList)}">
                <h5 class="item-block-text">注文履歴はありません。</h5>
            </div>

            <!-- 予約データが存在する場合 -->
            <div class="item-block" th:each="order : ${historyList}">
                <!-- 注文日 -->
                <h3 th:text="${order.formattedDate}">2026年9月7日</h3>
                
                <!-- 商品名 -->
                <h4 th:text="${item.goodsname}">元祖ザンギ弁当（5個）</h4>
                
                <!-- 金額 -->
                <h5 th:text="${#numbers.formatInteger(item.goodsprice, 1, 'COMMA') + '円'}">780円</h5>
                
                <!-- 商品画像 -->
                <img class="product-img" src="../static/img/ザンギ弁当.jpg" th:src="@{${item.imageUrl}}" alt="商品画像">
                
                <!-- トッピング・ソース一覧 -->
                <div th:each="sauce : ${item.customList}">
                    <p class="text-secondary mb-1" th:text="${sauce.name + '(+' + sauce.price + '円)'}">タルタルソース(+50円)</p>
                </div>
                
                <hr class="my-4">
                
                <!-- 再注文フォーム -->
                <form th:action="@{/reorder}" method="POST" class="d-inline">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <button type="submit" class="btn btn-warning px-4 text-white fw-bold" style="box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2);">もう一度注文する</button>
                </form>
            </div>
        </div>
    </main>

    <!-- フッダー部 -->
    <!-- いずれ移行 -->
	<!-- <div th:replace="~{common/footer}"></div> -->
    <footer class="footer-content">
        <div class="footer-btn">
            <a href=""><img style="width: 36px; height: 53px;" src="../static/img/ホームボタン.png" alt="ホーム"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 48px; height: 53px;"  src="../static/img/メニューボタン.png" alt="メニュー"></a>
        </div>
        <div class="footer-btn" style="position: relative; top: -20px;">
            <a href=""><img style="width: 77px; height: 96px;" src="../static/img/予約ボタン.png" alt="予約"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 33px; height: 51px;" src="../static/img/履歴ボタン.png" alt="履歴"></a>
        </div>
        <div class="footer-btn">
            <a href=""><img style="width: 60px; height: 51px;" src="../static/img/マイページボタン.png" alt="マイページ"></a>
        </div>
    </footer>
</body>

</html>
